name: Promote release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release candidate workflow run ID
        required: true
        type: string

concurrency:
  group: release-promotion
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-candidate:
    name: Verify candidate run and exact artifacts
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      targets: ${{ steps.candidate.outputs.targets }}
      releases: ${{ steps.candidate.outputs.releases }}
      has_images: ${{ steps.candidate.outputs.has_images }}
      has_chart: ${{ steps.candidate.outputs.has_chart }}
      has_forge: ${{ steps.candidate.outputs.has_forge }}
    steps:
      - name: Require promotion workflow from master
        run: test '${{ github.ref }}' = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind immutable promotion control
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$CONTROL_SHA" = '${{ github.workflow_sha }}'
      - name: Verify trusted successful candidate workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID")"
          test "$(jq -r '.name' <<<"$run")" = 'Release candidate'
          test "$(jq -r '.path' <<<"$run")" = '.github/workflows/release-candidate.yml'
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.head_branch' <<<"$run")" = master
          test "$(jq -r '.conclusion' <<<"$run")" = success
          mkdir candidate
          gh run download "$RUN_ID" --name release-candidate --dir candidate
      - name: Verify candidate checksums, source, and target bundle
        id: candidate
        env:
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python3 .github/scripts/release.py verify-candidate --directory candidate > verified-plan.json
          test "$(jq -r '.run_id' verified-plan.json)" = "$RUN_ID"
          source_sha="$(jq -r '.source_sha' verified-plan.json)"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$source_sha" origin/master
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'targets=%s\n' "$(jq -c '.targets' verified-plan.json)"
            printf 'releases=%s\n' "$(jq -c '.releases' verified-plan.json)"
            printf 'has_images=%s\n' "$(jq -r '(.image_matrix | length) > 0' verified-plan.json)"
            printf 'has_chart=%s\n' "$(jq -r '(.chart_matrix | length) > 0' verified-plan.json)"
            printf 'has_forge=%s\n' "$(jq -r '.forge' verified-plan.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and verify complete per-target Release manifests
        run: |
          python3 .github/scripts/release.py release-manifests \
            --candidate candidate --output release-manifests
          python3 .github/scripts/release.py verify-release-manifests \
            --candidate candidate --directory release-manifests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-candidate
          path: |
            candidate/
            release-manifests/
          retention-days: 7

  promote:
    name: Founder-approved exact promotion
    needs: verify-candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      deployments: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Promotion control always executes from the immutable dispatch SHA;
        # the independently verified candidate source may be any master member.
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-candidate
          path: .
      - name: Re-verify every privileged-boundary invariant after approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.verify-candidate.outputs.source_sha }}
          REQUIRE_IMMUTABLE_RELEASES: "true"
          AUDIT_REPOSITORY_SECRETS: "false"
          AUDIT_ADMIN_ENDPOINTS: "false"
        run: |
          test '${{ github.ref }}' = refs/heads/master
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$CONTROL_SHA" = '${{ github.workflow_sha }}'
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID")"
          test "$(jq -r '.name' <<<"$run")" = 'Release candidate'
          test "$(jq -r '.path' <<<"$run")" = '.github/workflows/release-candidate.yml'
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.head_branch' <<<"$run")" = master
          test "$(jq -r '.conclusion' <<<"$run")" = success
          python3 .github/scripts/release.py verify-candidate --directory candidate > verified-plan.json
          python3 .github/scripts/release.py verify-release-manifests \
            --candidate candidate --directory release-manifests
          test "$(jq -r '.run_id' verified-plan.json)" = "$RUN_ID"
          test "$(jq -r '.source_sha' verified-plan.json)" = "$SOURCE_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          .github/scripts/audit_release_security.sh '${{ github.repository }}'
      - uses: ./.github/actions/setup-kubernetes-tools
        if: needs.verify-candidate.outputs.has_chart == 'true'
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: needs.verify-candidate.outputs.has_images == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.verify-candidate.outputs.has_images == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure environment-scoped protected-tag credential
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          test -n "$RELEASE_TAG_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RELEASE_TAG_SSH_KEY" > ~/.ssh/release-tag
          chmod 600 ~/.ssh/release-tag
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          git remote set-url origin 'git@github.com:${{ github.repository }}.git'
          git config core.sshCommand 'ssh -i ~/.ssh/release-tag -o IdentitiesOnly=yes'
          git config user.name iterabase-release
          git config user.email release@iterabase.com
      - name: Final full authority and destination recheck before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ needs.verify-candidate.outputs.releases }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.verify-candidate.outputs.source_sha }}
          REQUIRE_IMMUTABLE_RELEASES: "true"
          AUDIT_REPOSITORY_SECRETS: "false"
          AUDIT_ADMIN_ENDPOINTS: "false"
        run: |
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$CONTROL_SHA" = '${{ github.workflow_sha }}'
          run="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID")"
          test "$(jq -r '.name' <<<"$run")" = 'Release candidate'
          test "$(jq -r '.path' <<<"$run")" = '.github/workflows/release-candidate.yml'
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.head_branch' <<<"$run")" = master
          test "$(jq -r '.conclusion' <<<"$run")" = success
          python3 .github/scripts/release.py verify-candidate --directory candidate > verified-plan.json
          python3 .github/scripts/release.py verify-release-manifests \
            --candidate candidate --directory release-manifests
          test "$(jq -r '.run_id' verified-plan.json)" = "$RUN_ID"
          test "$(jq -r '.source_sha' verified-plan.json)" = "$SOURCE_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          .github/scripts/audit_release_security.sh '${{ github.repository }}'
          .github/scripts/check_promotion_destinations.sh \
            candidate '${{ github.repository_owner }}' '${{ github.repository }}' release-manifests
          while IFS=$'\t' read -r tag _target; do
            direct="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            peeled="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            existing="${peeled:-$direct}"
            if [ -n "$existing" ]; then test "$existing" = '${{ needs.verify-candidate.outputs.source_sha }}'; fi
          done < <(jq -r '.[] | [.production_tag,.target] | @tsv' <<<"$RELEASES")
      - name: Promote tested image digests by adding semantic aliases
        if: needs.verify-candidate.outputs.has_images == 'true'
        run: |
          for metadata in candidate/assets/images/candidate-*.json; do
            [ "$(jq -r '.artifact_type' "$metadata")" = image ] || continue
            repository="$(jq -r '.repository' "$metadata")"
            version="$(jq -r '.version' "$metadata")"
            digest="$(jq -r '.digest' "$metadata")"
            candidate_tag="$(jq -r '.candidate_tag' "$metadata")"
            test "$(docker buildx imagetools inspect "$repository:$candidate_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$digest"
            existing="$(docker buildx imagetools inspect "$repository:$version" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
            if [ -n "$existing" ]; then
              test "$existing" = "$digest"
            else
              docker buildx imagetools create --tag "$repository:$version" "$repository@$digest"
            fi
            test "$(docker buildx imagetools inspect "$repository:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$digest"
          done
      - name: Publish unchanged chart archives
        if: needs.verify-candidate.outputs.has_chart == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          for package in candidate/assets/charts/*.tgz; do
            chart="$(basename "$package" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+\.tgz$//')"
            version="$(basename "$package" | sed -E "s/^${chart}-//;s/\.tgz$//")"
            repository="oci://ghcr.io/${{ github.repository_owner }}/iterabase-charts/$chart"
            existing="$(mktemp -d)"
            if helm pull "$repository" --version "$version" --destination "$existing" >/dev/null 2>&1; then
              cmp "$package" "$existing/$(basename "$package")"
            else
              helm push "$package" 'oci://ghcr.io/${{ github.repository_owner }}/iterabase-charts'
            fi
          done
      - name: Create or verify protected namespaced tags
        env:
          RELEASES: ${{ needs.verify-candidate.outputs.releases }}
          SOURCE_SHA: ${{ needs.verify-candidate.outputs.source_sha }}
        run: |
          while IFS= read -r tag; do
            direct="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            peeled="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            existing="${peeled:-$direct}"
            if [ -n "$existing" ]; then
              test "$existing" = "$SOURCE_SHA"
            else
              git -c tag.gpgSign=false tag -a "$tag" "$SOURCE_SHA" -m "Release $tag from $SOURCE_SHA"
              git push origin "refs/tags/$tag"
            fi
          done < <(jq -r '.[].production_tag' <<<"$RELEASES")
      - name: Stage complete drafts and publish each GitHub Release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          .github/scripts/publish_github_releases.sh
          candidate release-manifests '${{ github.repository }}'
