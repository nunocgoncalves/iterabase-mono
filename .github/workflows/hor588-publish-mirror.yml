name: HOR-588 publish MinIO mirror

# Temporary one-time publication of the archived MinIO images into the public
# GHCR mirror. Removed from the branch before the HOR-588 PR is opened.

on:
  push:
    branches: [HOR-588-fixture-image-cache]
    paths:
      - .github/workflows/hor588-publish-mirror.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish-minio-mirror
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository-locked crane
        run: .github/scripts/install_ci_tool.sh crane v0.22.1
      - name: Download the exact mirror source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirror"
          gh release download hor-588-minio-mirror-src \
            --pattern 'minio-*.tar' --dir "$RUNNER_TEMP/mirror" --clobber
          ls -la "$RUNNER_TEMP/mirror"
      - name: Publish the multi-arch mirror
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          repo=ghcr.io/nunocgoncalves/iterabase-third-party/minio
          tag=RELEASE.2025-09-07T16-13-09Z
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          crane push "$RUNNER_TEMP/mirror/minio-amd64.tar" "$repo:$tag-amd64"
          crane push "$RUNNER_TEMP/mirror/minio-arm64.tar" "$repo:$tag-arm64"
          crane index append -m "$repo:$tag-amd64" -m "$repo:$tag-arm64" -t "$repo:$tag"
          echo "mirror digest: $(crane digest "$repo:$tag")"
          crane delete "$repo:$tag-amd64"
          crane delete "$repo:$tag-arm64"
      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          repo_path=nunocgoncalves/iterabase-third-party/minio
          tag=RELEASE.2025-09-07T16-13-09Z
          digest=$(crane digest "ghcr.io/$repo_path:$tag")
          token=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo_path:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/$repo_path/manifests/$digest")
          echo "anonymous manifest status: $code"
          test "$code" = 200
