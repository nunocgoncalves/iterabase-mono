name: Forge E2E reaper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-e2e-reaper
  cancel-in-progress: false

env:
  GO_CACHE_DEPENDENCIES: |
    forge/test/e2e/go.sum

jobs:
  reaper:
    name: Reap orphaned Forge E2E droplets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: forge-e2e-reaper
      - name: Reap orphaned forge-e2e droplets
        run: go run ./cmd/reaper
        working-directory: forge/test/e2e
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
