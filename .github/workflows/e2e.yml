name: E2E

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read
  packages: read

# Each permanent fixture has one non-canceling lock shared by PR, master, and
# candidate execution. Independent CPU and GPU hosts may run concurrently.

env:
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum
    testkit/e2e/go.mod
    control-plane/test/e2e/go.mod
    charts/test/e2e/go.mod
    charts/test/e2e/go.sum
    .github/tools/go.sum
    .github/tools/control-plane/go.sum

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-plan-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      artifact_build_matrix: ${{ steps.plan.outputs.artifact_build_matrix }}
      scenario_matrix: ${{ steps.plan.outputs.scenario_matrix }}
      kind_matrix: ${{ steps.plan.outputs.kind_matrix }}
      real_machine_matrix: ${{ steps.plan.outputs.real_machine_matrix }}
      has_artifacts: ${{ steps.plan.outputs.has_artifacts }}
      has_scenarios: ${{ steps.plan.outputs.has_scenarios }}
      has_kind: ${{ steps.plan.outputs.has_kind }}
      has_real_machine: ${{ steps.plan.outputs.has_real_machine }}
      scenario_total: ${{ steps.plan.outputs.scenario_total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify the exact selected source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-plan
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Test the unified plan, recipe, composer, and result contracts
        run: python3 .github/scripts/test_e2e.py
      - name: Collect changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/collect_changed_paths.py
      - name: Generate execution plan
        id: plan
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/e2e.py plan \
            --intent pr \
            --source-sha "$SOURCE_SHA" \
            --selection-file /tmp/changed-path-selection.json \
            --output e2e-plan.json
          python3 .github/scripts/e2e.py resolve-baselines \
            --plan e2e-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-plan
          path: e2e-plan.json
          retention-days: 30

  runtime-contract:
    name: Runner contract
    needs: plan
    if: needs.plan.outputs.has_scenarios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-runtime-contract
      - run: make testkit-test

  artifacts:
    name: ${{ matrix.artifact }}
    needs: plan
    if: needs.plan.outputs.has_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: e2e-artifact-${{ matrix.artifact }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.artifact_build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify artifact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-artifact-${{ matrix.artifact }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Install checksummed GoReleaser
        if: matrix.kind == 'forge'
        uses: ./.github/actions/setup-ci-tool
        with: {name: goreleaser, version: 2.12.7}
      - name: Add reviewed Helm repositories
        if: matrix.kind == 'chart' || matrix.kind == 'chart-companion'
        run: .github/scripts/add_helm_repositories.sh
      - name: Build once from the reviewed production recipe
        run: >-
          python3 .github/scripts/e2e.py build-artifact
          --plan '${{ runner.temp }}/plan/e2e-plan.json'
          --artifact '${{ matrix.artifact }}'
          --output '${{ runner.temp }}/artifact'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-runtime-${{ matrix.artifact }}
          path: ${{ runner.temp }}/artifact/
          retention-days: 7

  kind:
    name: ${{ matrix.id }}
    needs: [plan, runtime-contract, artifacts]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.has_kind == 'true' &&
      needs.runtime-contract.result == 'success' &&
      (needs.artifacts.result == 'success' || needs.artifacts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.kind_matrix) }}
    concurrency:
      group: e2e-scenario-${{ matrix.artifact }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify scenario source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_artifacts == 'true'
        with:
          pattern: e2e-runtime-*
          path: ${{ runner.temp }}/artifacts
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-${{ matrix.artifact }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/setup-node
        if: matrix.target == 'test-e2e-browser'
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/test/e2e/playwright/package-lock.json
          cache-scope: e2e-browser
      - uses: ./.github/actions/setup-playwright
        if: matrix.target == 'test-e2e-browser'
        with: {version: 1.62.1}
      - name: Compose and verify the exact runtime bundle
        run: >-
          python3 .github/scripts/e2e.py compose
          --plan '${{ runner.temp }}/plan/e2e-plan.json'
          --scenario '${{ matrix.id }}'
          --artifacts '${{ runner.temp }}/artifacts'
          --output '${{ runner.temp }}/runtime'
          --env-output "$GITHUB_ENV"
      - name: Bind the required result artifact and retained runtime authority
        run: |
          mkdir -p '${{ runner.temp }}/result'
          cp '${{ runner.temp }}/runtime/runtime-bundle.json' '${{ runner.temp }}/result/runtime-bundle.json'
          echo 'ITERABASE_E2E_RESULT=${{ runner.temp }}/result/result.json' >> "$GITHUB_ENV"
      - name: Run the compiled owner scenario once
        working-directory: ${{ matrix.owner }}
        env:
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/diagnostics/${{ matrix.artifact }}
          E2E_SKIP_BUILD_DEPS: "true"
        run: make '${{ matrix.target }}'
      - name: Retain strict scenario result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-result-${{ matrix.artifact }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 30
      - name: Retain redacted diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.artifact }}
          path: ${{ runner.temp }}/diagnostics/${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7

  real-machine:
    name: ${{ matrix.capacity }}
    needs: [plan, runtime-contract, artifacts]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.has_real_machine == 'true' &&
      needs.runtime-contract.result == 'success' &&
      (needs.artifacts.result == 'success' || needs.artifacts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.real_machine_matrix) }}
    concurrency:
      group: iterabase-permanent-fixture-${{ matrix.capacity }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify capacity source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_artifacts == 'true'
        with:
          pattern: e2e-runtime-*
          path: ${{ runner.temp }}/artifacts
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-real-${{ matrix.capacity }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Authorize the founder-only fixture trust boundary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: .github/scripts/verify_fixture_trust.sh
      - name: Bind the fixed permanent fixture
        uses: ./.github/actions/setup-permanent-fixture
        with:
          capacity: ${{ matrix.capacity }}
          address: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_ADDRESS || vars.FORGE_E2E_GPU_ADDRESS }}
          ssh-user: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_SSH_USER || vars.FORGE_E2E_GPU_SSH_USER }}
          ssh-private-key: ${{ matrix.capacity == 'cpu' && secrets.FORGE_E2E_CPU_SSH_KEY || secrets.FORGE_E2E_GPU_SSH_KEY }}
          ssh-host-key: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_SSH_HOST_KEY || vars.FORGE_E2E_GPU_SSH_HOST_KEY }}
          workspace-device: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_WORKSPACE_DEVICE || vars.FORGE_E2E_GPU_WORKSPACE_DEVICE }}
          model-cache-device: ${{ matrix.capacity == 'gpu' && vars.FORGE_E2E_GPU_MODEL_CACHE_DEVICE || '' }}
          model-cache-uuid: ${{ matrix.capacity == 'gpu' && vars.FORGE_E2E_GPU_MODEL_CACHE_UUID || '' }}
      - name: Compose and run every scenario for this fixture serially
        env:
          SCENARIOS: ${{ toJSON(matrix.scenarios) }}
          GH_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p '${{ runner.temp }}/results' '${{ runner.temp }}/diagnostics'
          status=0
          while IFS= read -r scenario; do
            id=$(jq -r '.id' <<<"$scenario")
            owner=$(jq -r '.owner' <<<"$scenario")
            target=$(jq -r '.target' <<<"$scenario")
            artifact=$(jq -r '.artifact' <<<"$scenario")
            runtime='${{ runner.temp }}/runtime-'"$artifact"
            envfile='${{ runner.temp }}/env-'"$artifact"
            : > "$envfile"
            python3 .github/scripts/e2e.py compose \
              --plan '${{ runner.temp }}/plan/e2e-plan.json' \
              --scenario "$id" \
              --artifacts '${{ runner.temp }}/artifacts' \
              --output "$runtime" \
              --env-output "$envfile"
            cp "$runtime/runtime-bundle.json" '${{ runner.temp }}/results/'"$artifact.runtime-bundle.json"
            if ! (
              set -a
              source "$envfile"
              set +a
              export GITHUB_TOKEN="$GH_RUNTIME_TOKEN"
              export FORGE_E2E_REQUIRE_CAPACITY=true
              export ITERABASE_E2E_RESULT='${{ runner.temp }}/results/'"$artifact.json"
              export ITERABASE_E2E_DIAGNOSTICS='${{ runner.temp }}/diagnostics/'"$artifact"
              make -C "$owner" "$target"
            ); then
              status=1
            fi
          done < <(jq -c '.[]' <<<"$SCENARIOS")
          exit "$status"
      - name: Retain strict capacity results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-result-capacity-${{ matrix.capacity }}
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain redacted capacity diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-capacity-${{ matrix.capacity }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: E2E / required
    if: always()
    needs: [plan, runtime-contract, artifacts, kind, real-machine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_scenarios == 'true'
        with:
          pattern: e2e-result-*
          path: ${{ runner.temp }}/results
      - name: Reconcile the exact plan, result set, stages, and identities
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 .github/scripts/e2e.py validate-results
          --plan '${{ runner.temp }}/plan/e2e-plan.json'
          --results '${{ runner.temp }}/results'
          --needs-env NEEDS
