name: E2E

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      complete_catalogue:
        description: "Run the exact complete compiled catalogue (the default for manual dispatch)"
        required: false
        type: boolean
        default: false
      gpu_policy_red_proof:
        description: "Run the intentional HOR-411 deleteEmptyDir=false GPU mutation"
        required: false
        type: boolean
        default: false
      fixture_cleanup_red_proof:
        description: "Run the intentional HOR-540 permanent-GPU cleanup failure proof"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: read

# Every permanent CPU/GPU fixture path shares one literal non-canceling lock
# across PR, nightly/manual, candidate, intentional-red, and cleanup execution.
# Exact-head non-fixture jobs may supersede independently below.

env:
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum
    testkit/e2e/go.mod
    control-plane/test/e2e/go.mod
    charts/test/e2e/go.mod
    charts/test/e2e/go.sum

jobs:
  plan:
    name: Compile exact-head execution plan
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-plan-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      artifact_build_matrix: ${{ steps.plan.outputs.artifact_build_matrix }}
      kind_matrix: ${{ steps.plan.outputs.kind_matrix }}
      real_machine_matrix: ${{ steps.plan.outputs.real_machine_matrix }}
      has_artifacts: ${{ steps.plan.outputs.has_artifacts }}
      has_scenarios: ${{ steps.plan.outputs.has_scenarios }}
      has_kind: ${{ steps.plan.outputs.has_kind }}
      has_real_machine: ${{ steps.plan.outputs.has_real_machine }}
    steps:
      - name: Reject conflicting manual intents
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPLETE: ${{ inputs.complete_catalogue }}
          GPU_RED_PROOF: ${{ inputs.gpu_policy_red_proof }}
          CLEANUP_RED_PROOF: ${{ inputs.fixture_cleanup_red_proof }}
        run: |
          selected=0
          for value in "$COMPLETE" "$GPU_RED_PROOF" "$CLEANUP_RED_PROOF"; do
            if [ "$value" = true ]; then selected=$((selected + 1)); fi
          done
          test "$selected" -le 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify the exact selected source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-plan
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Test the unified plan, recipe, composer, and result contracts
        run: python3 .github/scripts/test_e2e.py
      - name: Collect changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/collect_changed_paths.py
          --all-event schedule
          --all-event workflow_dispatch
      - name: Generate one PR/nightly execution plan
        id: plan
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALL: ${{ steps.paths.outputs.all }}
          RED_PROOF: ${{ inputs.gpu_policy_red_proof == true || inputs.fixture_cleanup_red_proof == true }}
        run: |
          if [ "$RED_PROOF" = true ]; then
            : > /tmp/changed-paths
            intent=pr
          elif [ "$ALL" = true ]; then
            intent=nightly
          else
            intent=pr
          fi
          args=(plan --intent "$intent" --source-sha "$SOURCE_SHA" --output e2e-plan.json --github-output "$GITHUB_OUTPUT")
          if [ "$intent" = pr ]; then args+=(--paths-file /tmp/changed-paths); fi
          python3 .github/scripts/e2e.py "${args[@]}"
          python3 .github/scripts/e2e.py resolve-baselines --plan e2e-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-plan
          path: e2e-plan.json
          retention-days: 30

  runtime-contract:
    name: Compile shared runner and every owner entrypoint
    needs: plan
    if: needs.plan.outputs.has_scenarios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-runtime-contract
      - run: make testkit-test

  artifacts:
    name: Build exact source — ${{ matrix.artifact }}
    needs: plan
    if: needs.plan.outputs.has_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: e2e-artifact-${{ matrix.artifact }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.artifact_build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify artifact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-artifact-${{ matrix.artifact }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Add reviewed Helm repositories
        if: matrix.kind == 'chart' || matrix.kind == 'chart-companion'
        run: .github/scripts/add_helm_repositories.sh
      - name: Build once from the reviewed production recipe
        run: >-
          python3 .github/scripts/e2e.py build-artifact
          --plan '${{ runner.temp }}/plan/e2e-plan.json'
          --artifact '${{ matrix.artifact }}'
          --output '${{ runner.temp }}/artifact'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-runtime-${{ matrix.artifact }}
          path: ${{ runner.temp }}/artifact/
          retention-days: 7

  kind:
    name: Exact bundle — ${{ matrix.id }}
    needs: [plan, runtime-contract, artifacts]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.has_kind == 'true' &&
      needs.runtime-contract.result == 'success' &&
      (needs.artifacts.result == 'success' || needs.artifacts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.kind_matrix) }}
    concurrency:
      group: e2e-scenario-${{ matrix.artifact }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify scenario source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_artifacts == 'true'
        with:
          pattern: e2e-runtime-*
          path: ${{ runner.temp }}/artifacts
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-${{ matrix.artifact }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/setup-node
        if: matrix.target == 'test-e2e-browser'
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/test/e2e/playwright/package-lock.json
          cache-scope: e2e-browser
      - name: Compose and verify the exact runtime bundle
        run: >-
          python3 .github/scripts/e2e.py compose
          --plan '${{ runner.temp }}/plan/e2e-plan.json'
          --scenario '${{ matrix.id }}'
          --artifacts '${{ runner.temp }}/artifacts'
          --output '${{ runner.temp }}/runtime'
          --env-output "$GITHUB_ENV"
      - name: Bind the required result artifact and retained runtime authority
        run: |
          mkdir -p '${{ runner.temp }}/result'
          cp '${{ runner.temp }}/runtime/runtime-bundle.json' '${{ runner.temp }}/result/runtime-bundle.json'
          echo 'ITERABASE_E2E_RESULT=${{ runner.temp }}/result/result.json' >> "$GITHUB_ENV"
      - name: Run the compiled owner scenario once
        working-directory: ${{ matrix.owner }}
        env:
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/diagnostics/${{ matrix.artifact }}
          E2E_SKIP_BUILD_DEPS: "true"
          PLAYWRIGHT_INSTALL_ARGS: ${{ matrix.target == 'test-e2e-browser' && '--with-deps chromium' || 'chromium' }}
        run: make '${{ matrix.target }}'
      - name: Retain strict scenario result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-result-${{ matrix.artifact }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 30
      - name: Retain redacted diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.artifact }}
          path: ${{ runner.temp }}/diagnostics/${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7

  real-machine:
    name: Exact bundle capacity — ${{ matrix.capacity }}
    needs: [plan, runtime-contract, artifacts]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.has_real_machine == 'true' &&
      needs.runtime-contract.result == 'success' &&
      (needs.artifacts.result == 'success' || needs.artifacts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.real_machine_matrix) }}
    concurrency:
      group: iterabase-permanent-fixtures
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify capacity source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_artifacts == 'true'
        with:
          pattern: e2e-runtime-*
          path: ${{ runner.temp }}/artifacts
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-real-${{ matrix.capacity }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Bind the fixed permanent fixture
        uses: ./.github/actions/setup-permanent-fixture
        with:
          capacity: ${{ matrix.capacity }}
          address: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_ADDRESS || vars.FORGE_E2E_GPU_ADDRESS }}
          ssh-user: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_SSH_USER || vars.FORGE_E2E_GPU_SSH_USER }}
          ssh-private-key: ${{ matrix.capacity == 'cpu' && secrets.FORGE_E2E_CPU_SSH_KEY || secrets.FORGE_E2E_GPU_SSH_KEY }}
          ssh-host-key: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_SSH_HOST_KEY || vars.FORGE_E2E_GPU_SSH_HOST_KEY }}
          workspace-device: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_WORKSPACE_DEVICE || vars.FORGE_E2E_GPU_WORKSPACE_DEVICE }}
          model-cache-device: ${{ matrix.capacity == 'gpu' && vars.FORGE_E2E_GPU_MODEL_CACHE_DEVICE || '' }}
          model-cache-uuid: ${{ matrix.capacity == 'gpu' && vars.FORGE_E2E_GPU_MODEL_CACHE_UUID || '' }}
      - name: Compose and run every scenario for this fixture serially
        env:
          SCENARIOS: ${{ toJSON(matrix.scenarios) }}
          GH_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p '${{ runner.temp }}/results' '${{ runner.temp }}/diagnostics'
          status=0
          while IFS= read -r scenario; do
            id=$(jq -r '.id' <<<"$scenario")
            owner=$(jq -r '.owner' <<<"$scenario")
            target=$(jq -r '.target' <<<"$scenario")
            artifact=$(jq -r '.artifact' <<<"$scenario")
            runtime='${{ runner.temp }}/runtime-'"$artifact"
            envfile='${{ runner.temp }}/env-'"$artifact"
            : > "$envfile"
            python3 .github/scripts/e2e.py compose \
              --plan '${{ runner.temp }}/plan/e2e-plan.json' \
              --scenario "$id" \
              --artifacts '${{ runner.temp }}/artifacts' \
              --output "$runtime" \
              --env-output "$envfile"
            cp "$runtime/runtime-bundle.json" '${{ runner.temp }}/results/'"$artifact.runtime-bundle.json"
            if ! (
              set -a
              source "$envfile"
              set +a
              export GITHUB_TOKEN="$GH_RUNTIME_TOKEN"
              export FORGE_E2E_REQUIRE_CAPACITY=true
              export ITERABASE_E2E_RESULT='${{ runner.temp }}/results/'"$artifact.json"
              export ITERABASE_E2E_DIAGNOSTICS='${{ runner.temp }}/diagnostics/'"$artifact"
              make -C "$owner" "$target"
            ); then
              status=1
            fi
          done < <(jq -c '.[]' <<<"$SCENARIOS")
          exit "$status"
      - name: Retain strict capacity results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-result-capacity-${{ matrix.capacity }}
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain redacted capacity diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-capacity-${{ matrix.capacity }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  gpu-red-proof:
    name: Intentional HOR-411 GPU red proof
    needs: plan
    if: inputs.gpu_policy_red_proof == true
    runs-on: ubuntu-latest
    timeout-minutes: 115
    concurrency:
      group: iterabase-permanent-fixtures
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: forge/test/e2e/go.sum
          cache-scope: e2e-gpu-red-proof
      - name: Bind the fixed permanent GPU fixture
        uses: ./.github/actions/setup-permanent-fixture
        with:
          capacity: gpu
          address: ${{ vars.FORGE_E2E_GPU_ADDRESS }}
          ssh-user: ${{ vars.FORGE_E2E_GPU_SSH_USER }}
          ssh-private-key: ${{ secrets.FORGE_E2E_GPU_SSH_KEY }}
          ssh-host-key: ${{ vars.FORGE_E2E_GPU_SSH_HOST_KEY }}
          workspace-device: ${{ vars.FORGE_E2E_GPU_WORKSPACE_DEVICE }}
          model-cache-device: ${{ vars.FORGE_E2E_GPU_MODEL_CACHE_DEVICE }}
          model-cache-uuid: ${{ vars.FORGE_E2E_GPU_MODEL_CACHE_UUID }}
      - name: Prove the normal scenario rejects the intentional mutation
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERABASE_E2E_FIXTURE_MODE: source
          ITERABASE_E2E_SOURCE_SHA: ${{ github.sha }}
          ITERABASE_E2E_SOURCE_INPUTS: ${{ github.workspace }}/forge/test/e2e/published-fixture.json
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/diagnostics/gpu-policy
        run: make test-e2e-gpu-broken-policy
      - name: Retain intentional policy-failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-red-proof-gpu-policy
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: error
          retention-days: 30

  cleanup-red-proof:
    name: Intentional HOR-540 permanent cleanup red proof
    needs: plan
    if: inputs.fixture_cleanup_red_proof == true
    runs-on: ubuntu-latest
    timeout-minutes: 115
    concurrency:
      group: iterabase-permanent-fixtures
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: forge/test/e2e/go.sum
          cache-scope: e2e-cleanup-red-proof
      - name: Bind the fixed permanent GPU fixture
        uses: ./.github/actions/setup-permanent-fixture
        with:
          capacity: gpu
          address: ${{ vars.FORGE_E2E_GPU_ADDRESS }}
          ssh-user: ${{ vars.FORGE_E2E_GPU_SSH_USER }}
          ssh-private-key: ${{ secrets.FORGE_E2E_GPU_SSH_KEY }}
          ssh-host-key: ${{ vars.FORGE_E2E_GPU_SSH_HOST_KEY }}
          workspace-device: ${{ vars.FORGE_E2E_GPU_WORKSPACE_DEVICE }}
          model-cache-device: ${{ vars.FORGE_E2E_GPU_MODEL_CACHE_DEVICE }}
          model-cache-uuid: ${{ vars.FORGE_E2E_GPU_MODEL_CACHE_UUID }}
      - name: Prove a cleanup-hook failure stays red after the real reset
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERABASE_E2E_FIXTURE_MODE: source
          ITERABASE_E2E_SOURCE_SHA: ${{ github.sha }}
          ITERABASE_E2E_SOURCE_INPUTS: ${{ github.workspace }}/forge/test/e2e/published-fixture.json
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/diagnostics/cleanup
        run: make test-e2e-gpu-broken-cleanup
      - name: Retain intentional cleanup-failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-red-proof-cleanup
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: error
          retention-days: 30

  required:
    name: E2E / required
    if: always()
    needs: [plan, runtime-contract, artifacts, kind, real-machine, gpu-red-proof, cleanup-red-proof]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.has_scenarios == 'true'
        with:
          pattern: e2e-result-*
          path: ${{ runner.temp }}/results
      - name: Reconcile the exact plan, result set, stages, and identities
        if: inputs.gpu_policy_red_proof != true && inputs.fixture_cleanup_red_proof != true
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 .github/scripts/e2e.py validate-results
          --plan '${{ runner.temp }}/plan/e2e-plan.json'
          --results '${{ runner.temp }}/results'
          --needs-env NEEDS
      - name: Require only the selected intentional red proof
        if: inputs.gpu_policy_red_proof == true || inputs.fixture_cleanup_red_proof == true
        env:
          GPU_SELECTED: ${{ inputs.gpu_policy_red_proof }}
          GPU_RESULT: ${{ needs.gpu-red-proof.result }}
          CLEANUP_SELECTED: ${{ inputs.fixture_cleanup_red_proof }}
          CLEANUP_RESULT: ${{ needs.cleanup-red-proof.result }}
        run: |
          if [ "$GPU_SELECTED" = true ]; then test "$GPU_RESULT" = success; fi
          if [ "$CLEANUP_SELECTED" = true ]; then test "$CLEANUP_RESULT" = success; fi
