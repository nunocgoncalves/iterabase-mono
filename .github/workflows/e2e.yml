name: E2E

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      complete_catalogue:
        description: "Rehearse the exact complete scheduled catalogue and fail on any incomplete required job"
        required: false
        type: boolean
        default: false
      gpu_policy_red_proof:
        description: "Run the intentional HOR-411 deleteEmptyDir=false GPU mutation instead of the green GPU scenario"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum
    testkit/e2e/go.mod
    control-plane/test/e2e/go.mod
    charts/test/e2e/go.mod
    charts/test/e2e/go.sum

jobs:
  changes:
    name: select
    runs-on: ubuntu-latest
    outputs:
      control_plane: ${{ steps.select.outputs.control_plane }}
      harness: ${{ steps.select.outputs.harness }}
      tool_runner: ${{ steps.select.outputs.tool_runner }}
      inference_gateway: ${{ steps.select.outputs.inference_gateway }}
      forge_e2e: ${{ steps.select.outputs.forge_e2e }}
      forge_real_e2e: ${{ steps.select.outputs.forge_real_e2e }}
      charts: ${{ steps.select.outputs.charts }}
      nightly_kind_matrix: ${{ steps.nightly.outputs.nightly_kind_matrix }}
      nightly_real_machine_matrix: ${{ steps.nightly.outputs.nightly_real_machine_matrix }}
      nightly_owner_totals: ${{ steps.nightly.outputs.nightly_owner_totals }}
      nightly_scenario_total: ${{ steps.nightly.outputs.nightly_scenario_total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject conflicting manual E2E intents
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPLETE_CATALOGUE: ${{ inputs.complete_catalogue }}
          GPU_POLICY_RED_PROOF: ${{ inputs.gpu_policy_red_proof }}
        run: test "$COMPLETE_CATALOGUE:$GPU_POLICY_RED_PROOF" != "true:true"
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-nightly-catalogue
      - name: Test path and nightly selection fixtures
        run: |
          python3 .github/scripts/test_select_ci.py
          python3 .github/scripts/test_nightly_e2e.py
      - name: Select the complete compiled nightly catalogue
        id: nightly
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/nightly_e2e.py plan
          --source-sha "$SOURCE_SHA"
          --output nightly-e2e-plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Retain complete catalogue selection evidence
        if: github.event_name == 'schedule' || inputs.complete_catalogue == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-e2e-plan
          path: nightly-e2e-plan.json
          retention-days: 30
      - name: Collect changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/collect_changed_paths.py
          --all-event schedule
          --all-event workflow_dispatch
      - name: Select E2E owners
        id: select
        run: |
          if [ "${{ steps.paths.outputs.all }}" = true ]; then
            python3 .github/scripts/select_ci.py --all
          else
            python3 .github/scripts/select_ci.py --paths-file /tmp/changed-paths
          fi

  harness:
    name: harness-unit
    needs: changes
    if: needs.changes.outputs.forge_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-harness
      - name: Test shared mechanics and compile every owner entrypoint
        run: make testkit-test
      - name: Compile Forge scenarios and test harness internals
        run: make test-e2e-unit
        working-directory: forge
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint nested E2E module
        run: golangci-lint run ./...
        working-directory: forge/test/e2e

  digitalocean-cpu:
    name: digitalocean-cpu
    needs: [changes, harness]
    if: >-
      needs.changes.outputs.forge_real_e2e == 'true' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.complete_catalogue != true))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: e2e-digitalocean-cpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-digitalocean-cpu
      - name: Composed CPU E2E
        run: make test-e2e
        working-directory: forge
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERABASE_E2E_FIXTURE_MODE: source
          ITERABASE_E2E_SOURCE_SHA: ${{ github.sha }}
          ITERABASE_E2E_SOURCE_INPUTS: ${{ github.workspace }}/forge/test/e2e/published-fixture.json
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/forge-diagnostics
      - name: Upload redacted CPU failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-diagnostics-digitalocean-cpu
          path: ${{ runner.temp }}/forge-diagnostics/digitalocean-cpu
          if-no-files-found: ignore
          retention-days: 7

  digitalocean-gpu:
    name: digitalocean-gpu
    needs: [changes, harness]
    if: >-
      needs.changes.outputs.forge_real_e2e == 'true' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.complete_catalogue != true))
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      ITERABASE_E2E_FIXTURE_MODE: source
      ITERABASE_E2E_SOURCE_SHA: ${{ github.sha }}
      ITERABASE_E2E_SOURCE_INPUTS: ${{ github.workspace }}/forge/test/e2e/published-fixture.json
    concurrency:
      group: e2e-digitalocean-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-digitalocean-gpu
      - name: Composed GPU E2E with exact published dependencies
        if: inputs.gpu_policy_red_proof != true
        run: make test-e2e-gpu
        working-directory: forge
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/forge-diagnostics
      - name: Intentional HOR-411 broken-policy red proof
        if: inputs.gpu_policy_red_proof == true
        run: make test-e2e-gpu-broken-policy
        working-directory: forge
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/forge-diagnostics
      - name: Upload redacted GPU failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-diagnostics-digitalocean-gpu
          path: ${{ runner.temp }}/forge-diagnostics/digitalocean-gpu
          if-no-files-found: ignore
          retention-days: 7

  control-plane-kind:
    name: control-plane-${{ matrix.name }}
    needs: changes
    if: >-
      (needs.changes.outputs.control_plane == 'true' || needs.changes.outputs.charts == 'true') &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.complete_catalogue != true))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-api
            target: test-e2e-identity
            timeout: 30
          - name: work-recovery
            target: test-e2e-work
            timeout: 35
          - name: artifact-durability
            target: test-e2e-artifact
            timeout: 35
          - name: browser-journeys
            target: test-e2e-browser
            timeout: 45
    concurrency:
      group: e2e-control-plane-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-control-plane-${{ matrix.name }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/setup-node
        if: matrix.target == 'test-e2e-browser'
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/test/e2e/playwright/package-lock.json
          cache-scope: e2e-control-plane-browser
      - name: Run source-built control-plane owner scenario
        working-directory: control-plane
        env:
          ITERABASE_E2E_FIXTURE_MODE: source
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/control-plane-diagnostics/${{ matrix.target }}
          PLAYWRIGHT_INSTALL_ARGS: ${{ matrix.target == 'test-e2e-browser' && '--with-deps chromium' || 'chromium' }}
        run: make '${{ matrix.target }}'
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/control-plane-diagnostics/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7

  control-plane-execution-kind:
    name: control-plane-execution-contracts
    needs: changes
    if: >-
      (needs.changes.outputs.control_plane == 'true' ||
      needs.changes.outputs.harness == 'true' ||
      needs.changes.outputs.tool_runner == 'true' ||
      needs.changes.outputs.inference_gateway == 'true' ||
      needs.changes.outputs.charts == 'true') &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.complete_catalogue != true))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: e2e-control-plane-execution-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-control-plane-execution
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Run source-built deployed execution contracts
        working-directory: control-plane
        env:
          ITERABASE_E2E_FIXTURE_MODE: source
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/control-plane-diagnostics/test-e2e-execution
        run: make test-e2e-execution
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-diagnostics-test-e2e-execution
          path: ${{ runner.temp }}/control-plane-diagnostics/test-e2e-execution
          if-no-files-found: ignore
          retention-days: 7

  nightly-kind:
    name: nightly-${{ matrix.id }}
    needs: changes
    if: github.event_name == 'schedule' || inputs.complete_catalogue == true
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.nightly_kind_matrix) }}
    concurrency:
      group: e2e-nightly-${{ matrix.artifact }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-nightly-${{ matrix.artifact }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/setup-node
        if: matrix.target == 'test-e2e-browser'
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/test/e2e/playwright/package-lock.json
          cache-scope: e2e-nightly-control-plane-browser
      - uses: ./.github/actions/cache-helm
        if: matrix.owner == 'charts'
        with:
          cache-scope: nightly-${{ matrix.artifact }}
      - name: Add external chart repositories
        if: matrix.owner == 'charts'
        run: .github/scripts/add_helm_repositories.sh
      - name: Build source chart dependencies
        if: matrix.owner == 'charts'
        run: make build-deps
        working-directory: charts
      - name: Run required source owner scenario
        working-directory: ${{ matrix.owner }}
        env:
          ITERABASE_E2E_FIXTURE_MODE: ${{ matrix.fixture_mode }}
          ITERABASE_E2E_SOURCE_SHA: ${{ github.sha }}
          ITERABASE_E2E_SOURCE_DIRTY: "false"
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/nightly-kind-diagnostics/${{ matrix.artifact }}
          E2E_SKIP_BUILD_DEPS: ${{ matrix.owner == 'charts' && 'true' || 'false' }}
          PLAYWRIGHT_INSTALL_ARGS: ${{ matrix.target == 'test-e2e-browser' && '--with-deps chromium' || 'chromium' }}
        run: make '${{ matrix.target }}'
      - name: Upload redacted nightly failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-kind-diagnostics-${{ matrix.artifact }}
          path: ${{ runner.temp }}/nightly-kind-diagnostics/${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7

  charts-runtime:
    name: charts-runtime
    needs: changes
    if: >-
      needs.changes.outputs.charts == 'true' &&
      github.event_name != 'schedule' &&
      inputs.complete_catalogue != true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/charts-runtime.yml

  nightly-real-machine:
    name: nightly-${{ matrix.id }}
    needs: [changes, harness]
    if: github.event_name == 'schedule' || inputs.complete_catalogue == true
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.nightly_real_machine_matrix) }}
    concurrency:
      group: e2e-digitalocean-${{ matrix.capacity }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-nightly-real-${{ matrix.capacity }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Require mandatory capacity credentials
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: test -n "$DIGITALOCEAN_TOKEN"
      - name: Run required source real-machine scenario
        working-directory: ${{ matrix.owner }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_E2E_REQUIRE_CAPACITY: "true"
          ITERABASE_E2E_FIXTURE_MODE: ${{ matrix.fixture_mode }}
          ITERABASE_E2E_SOURCE_SHA: ${{ github.sha }}
          ITERABASE_E2E_SOURCE_DIRTY: "false"
          ITERABASE_E2E_SOURCE_INPUTS: ${{ github.workspace }}/forge/test/e2e/published-fixture.json
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/nightly-real-machine-diagnostics/${{ matrix.artifact }}
        run: make '${{ matrix.target }}'
      - name: Upload redacted nightly real-machine failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-real-machine-diagnostics-${{ matrix.artifact }}
          path: ${{ runner.temp }}/nightly-real-machine-diagnostics/${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: E2E / required
    if: always()
    needs:
      - changes
      - harness
      - digitalocean-cpu
      - digitalocean-gpu
      - control-plane-kind
      - control-plane-execution-kind
      - nightly-kind
      - charts-runtime
      - nightly-real-machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected E2E owner
        env:
          COMPLETE_CATALOGUE: ${{ inputs.complete_catalogue == true }}
          EVENT_NAME: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 .github/scripts/nightly_e2e.py validate-results
          --event-name "$EVENT_NAME"
          --complete-catalogue "$COMPLETE_CATALOGUE"
