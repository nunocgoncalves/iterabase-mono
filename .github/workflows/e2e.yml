name: E2E

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum

jobs:
  changes:
    name: select
    runs-on: ubuntu-latest
    outputs:
      forge_e2e: ${{ steps.select.outputs.forge_e2e }}
      forge_real_e2e: ${{ steps.select.outputs.forge_real_e2e }}
      charts: ${{ steps.select.outputs.charts }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Test path-selection fixture matrix
        run: python3 .github/scripts/test_select_ci.py
      - name: Collect changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/collect_changed_paths.py
          --all-event schedule
          --all-event workflow_dispatch
      - name: Select E2E owners
        id: select
        run: |
          if [ "${{ steps.paths.outputs.all }}" = true ]; then
            python3 .github/scripts/select_ci.py --all
          else
            python3 .github/scripts/select_ci.py --paths-file /tmp/changed-paths
          fi

  harness:
    name: harness-unit
    needs: changes
    if: needs.changes.outputs.forge_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-harness
      - name: Compile scenarios and test harness internals
        run: make test-e2e-unit
        working-directory: forge
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint nested E2E module
        run: golangci-lint run ./...
        working-directory: forge/test/e2e

  digitalocean-cpu:
    name: digitalocean-cpu
    needs: [changes, harness]
    if: >-
      needs.changes.outputs.forge_real_e2e == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: e2e-digitalocean-cpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-digitalocean-cpu
      - name: Composed CPU E2E
        run: make test-e2e
        working-directory: forge
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  digitalocean-gpu:
    name: digitalocean-gpu
    needs: [changes, harness]
    if: >-
      github.event_name == 'schedule' ||
      (needs.changes.outputs.forge_real_e2e == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: e2e-digitalocean-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-digitalocean-gpu
      - name: Composed GPU E2E
        run: make test-e2e-gpu
        working-directory: forge
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kind:
    name: kind-${{ matrix.name }}
    needs: [changes, harness]
    if: >-
      needs.changes.outputs.forge_e2e == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controlplane-identity
            target: test-e2e-controlplane
            timeout: 20
          - name: inference-contract
            target: test-e2e-inference
            timeout: 20
          - name: cert-issuers
            target: test-e2e-cert-issuers
            timeout: 20
          - name: internal-tls
            target: test-e2e-internal-tls
            timeout: 25
          - name: tool-runner-contract
            target: test-e2e-tool-runner
            timeout: 35
    concurrency:
      group: e2e-kind-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-kind-${{ matrix.name }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: e2e-kind-${{ matrix.name }}
      - name: Add external chart repositories
        run: .github/scripts/add_helm_repositories.sh
      - name: Build coordinated chart dependencies
        if: matrix.name != 'tool-runner-contract'
        run: |
          helm dependency build charts/charts/control-plane
          if [ "${{ matrix.name }}" != controlplane-identity ]; then
            helm dependency build charts/charts/cert-manager-substrate
            helm dependency build charts/charts/iterabase-platform
          fi
      - name: Run ${{ matrix.name }} from monorepo source
        run: make ${{ matrix.target }}
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERABASE_CONTROL_PLANE_ROOT: ${{ matrix.name == 'tool-runner-contract' && format('{0}/control-plane', github.workspace) || '' }}
          ITERABASE_CHARTS_ROOT: ${{ matrix.name == 'tool-runner-contract' && format('{0}/charts', github.workspace) || '' }}
          ITERABASE_LOCAL_CHART: ${{ format('{0}/charts/charts/iterabase-platform', github.workspace) }}
          ITERABASE_PLATFORM_LOCAL_CHART: ${{ format('{0}/charts/charts/iterabase-platform', github.workspace) }}
          CONTROL_PLANE_LOCAL_CHART: ${{ format('{0}/charts/charts/control-plane', github.workspace) }}
  published-compatibility:
    name: published-latest-${{ matrix.name }}
    needs: [changes, harness]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controlplane-identity
            target: test-e2e-controlplane
            timeout: 20
          - name: inference-contract
            target: test-e2e-inference
            timeout: 20
          - name: cert-issuers
            target: test-e2e-cert-issuers
            timeout: 20
          - name: internal-tls
            target: test-e2e-internal-tls
            timeout: 25
          - name: tool-runner-contract
            target: test-e2e-tool-runner
            timeout: 35
    concurrency:
      group: e2e-published-latest-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-published-${{ matrix.name }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Run ${{ matrix.name }} against latest published artifacts
        run: make ${{ matrix.target }}
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_E2E_USE_LATEST_RELEASE: "true"
  charts-runtime:
    name: charts-runtime
    needs: changes
    if: >-
      needs.changes.outputs.charts == 'true' &&
      github.event_name != 'schedule'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/charts-runtime.yml

  required:
    name: E2E / required
    if: always()
    needs:
      - changes
      - harness
      - digitalocean-cpu
      - digitalocean-gpu
      - kind
      - published-compatibility
      - charts-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected E2E owner
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {name: job["result"] for name, job in needs.items() if job["result"] not in {"success", "skipped"}}
          print("selected E2E results:", json.dumps({name: job["result"] for name, job in needs.items()}, sort_keys=True))
          if failed:
              print("required E2E owners failed:", json.dumps(failed, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          PY
