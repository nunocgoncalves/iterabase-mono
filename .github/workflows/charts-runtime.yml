name: Charts runtime

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to validate (defaults to the caller commit)
        required: false
        type: string
      candidate_bundle:
        description: Download and compose all chart candidates produced by the calling bundle
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: charts

jobs:
  chart-runtime:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: certificate ownership migration
            target: test-e2e-certificate-migration
          - name: fresh install
            target: test-e2e-install
          - name: observability
            target: test-e2e-observability
          - name: observability internal TLS
            target: test-e2e-observability-tls
          - name: platform internal TLS
            target: test-e2e-internal-tls
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            charts/test/e2e/go.mod
            testkit/e2e/go.mod
          cache-scope: charts-${{ matrix.target }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.candidate_bundle
        with:
          pattern: candidate-chart-*
          path: ${{ runner.temp }}/candidates/charts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.candidate_bundle
        with:
          name: candidate-plan
          path: ${{ runner.temp }}/candidate-plan
      - name: Add external chart repositories
        run: ../.github/scripts/add_helm_repositories.sh
      - name: Build source chart dependencies
        if: ${{ !inputs.candidate_bundle }}
        run: make build-deps
      - name: Compose exact candidate bundle fixture
        if: inputs.candidate_bundle
        working-directory: .
        run: >-
          .github/scripts/prepare_candidate_runtime.sh
          '${{ runner.temp }}/candidate-plan/candidate-plan.json'
          '${{ runner.temp }}/candidates'
          "$GITHUB_ENV"
      - name: Run chart-owned shared-testkit scenario
        env:
          ITERABASE_E2E_FIXTURE_MODE: ${{ inputs.candidate_bundle && 'candidate' || 'source' }}
          ITERABASE_E2E_CANDIDATE_PLAN: ${{ runner.temp }}/candidate-plan/candidate-plan.json
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/charts-diagnostics/${{ matrix.target }}
        run: make E2E_SKIP_BUILD_DEPS=true '${{ matrix.target }}'
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charts-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/charts-diagnostics/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
