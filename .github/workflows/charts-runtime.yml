name: Charts runtime

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to validate (defaults to the caller commit)
        required: false
        type: string
      candidate_bundle:
        description: Download and compose all chart candidates produced by the calling bundle
        required: false
        default: false
        type: boolean
      image_candidates:
        description: Download selected image candidates into the composed chart runtime fixture
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: charts

jobs:
  chart-runtime:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: certificate ownership migration
            target: test-e2e-certificate-migration
          - name: fresh install
            target: test-e2e-install
          - name: N-1 upgrade
            target: test-e2e-upgrade
          - name: feature enable on upgrade
            target: test-e2e-feature-enable
          - name: single-node observability ingress recovery
            target: test-e2e-observability-ingress-recovery
          - name: reapply rollback recovery
            target: test-e2e-reapply-rollback
          - name: metalLB upgrade reapply
            target: test-e2e-metallb-transition
          - name: observability
            target: test-e2e-observability
          - name: observability internal TLS
            target: test-e2e-observability-tls
          - name: platform internal TLS
            target: test-e2e-internal-tls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            charts/test/e2e/go.mod
            charts/test/e2e/go.sum
            testkit/e2e/go.mod
          cache-scope: charts-${{ matrix.target }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.candidate_bundle
        with:
          pattern: candidate-chart-*
          path: ${{ runner.temp }}/candidates/charts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.candidate_bundle && inputs.image_candidates
        with:
          pattern: candidate-image-*
          path: ${{ runner.temp }}/candidates/images
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.candidate_bundle
        with:
          name: candidate-plan
          path: ${{ runner.temp }}/candidate-plan
      - name: Add external chart repositories
        run: ../.github/scripts/add_helm_repositories.sh
      - name: Build source chart dependencies
        if: ${{ !inputs.candidate_bundle }}
        run: make build-deps
      - name: Compose exact candidate bundle fixture
        if: inputs.candidate_bundle
        working-directory: .
        run: >-
          .github/scripts/prepare_candidate_runtime.sh
          '${{ runner.temp }}/candidate-plan/candidate-plan.json'
          '${{ runner.temp }}/candidates'
          "$GITHUB_ENV"
      - name: Run chart-owned shared-testkit scenario
        env:
          ITERABASE_E2E_FIXTURE_MODE: ${{ inputs.candidate_bundle && 'candidate' || 'source' }}
          ITERABASE_E2E_CANDIDATE_PLAN: ${{ runner.temp }}/candidate-plan/candidate-plan.json
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/charts-diagnostics/${{ matrix.target }}
        run: make E2E_SKIP_BUILD_DEPS=true '${{ matrix.target }}'
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charts-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/charts-diagnostics/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
