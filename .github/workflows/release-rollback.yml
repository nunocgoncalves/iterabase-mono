name: Roll back complete release baseline

on:
  workflow_dispatch:
    inputs:
      current_anchor_release_id:
        description: Exact current GitHub Latest Release ID
        required: true
        type: string
      destination_anchor_release_id:
        description: Exact whole-snapshot ancestor anchor Release ID
        required: true
        type: string
      linear_identifier:
        description: Authorizing Linear issue (HOR-NNN)
        required: true
        type: string
      reason:
        description: Required rollback reason
        required: true
        type: string

concurrency:
  group: release-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Founder-approved whole-snapshot rollback
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      deployments: read
    steps:
      - name: Require protected rollback control from master
        run: test '${{ github.ref }}' = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind immutable rollback control and audit authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_SHA: ${{ github.sha }}
          AUDIT_REPOSITORY_SECRETS: "false"
          AUDIT_ADMIN_ENDPOINTS: "false"
        run: |
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$CONTROL_SHA" = '${{ github.workflow_sha }}'
          .github/scripts/audit_release_security.sh '${{ github.repository }}'
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Install checksummed Buildx for complete ancestor verification
        uses: ./.github/actions/setup-ci-tool
        with: {name: buildx, version: 0.36.1}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the chart registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Re-audit and move only the protected Latest pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_SHA: ${{ github.sha }}
          AUDIT_REPOSITORY_SECRETS: "false"
          AUDIT_ADMIN_ENDPOINTS: "false"
        run: |
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$CONTROL_SHA" = '${{ github.workflow_sha }}'
          .github/scripts/audit_release_security.sh '${{ github.repository }}'
          python3 .github/scripts/release_baseline.py rollback \
            --current-anchor-id '${{ inputs.current_anchor_release_id }}' \
            --destination-anchor-id '${{ inputs.destination_anchor_release_id }}' \
            --linear-identifier '${{ inputs.linear_identifier }}' \
            --reason '${{ inputs.reason }}' \
            --output rollback-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rollback-evidence
          path: rollback-evidence.json
          retention-days: 90
