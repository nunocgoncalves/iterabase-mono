name: Setup permanent Forge E2E fixture

description: Bind one founder-configured fixed fixture without provider authority

inputs:
  capacity:
    required: true
    description: cpu or gpu
  address:
    required: true
    description: Founder-allowlisted fixture address
  ssh-user:
    required: true
    description: Fixed fixture SSH user
  ssh-private-key:
    required: true
    description: Fixture-scoped private key
  ssh-host-key:
    required: true
    description: Pinned OpenSSH public host key
  workspace-device:
    required: true
    description: Exact Forge AgentPool workspace by-id device
  model-cache-device:
    required: false
    description: Exact GPU model-cache by-id device
  model-cache-uuid:
    required: false
    description: Exact GPU model-cache filesystem UUID

runs:
  using: composite
  steps:
    - name: Validate and bind the fixed fixture
      shell: bash
      env:
        CAPACITY: ${{ inputs.capacity }}
        ADDRESS: ${{ inputs.address }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_HOST_KEY: ${{ inputs.ssh-host-key }}
        WORKSPACE_DEVICE: ${{ inputs.workspace-device }}
        MODEL_CACHE_DEVICE: ${{ inputs.model-cache-device }}
        MODEL_CACHE_UUID: ${{ inputs.model-cache-uuid }}
      run: |
        set -euo pipefail
        case "$CAPACITY" in cpu|gpu) ;; *) echo "invalid permanent fixture capacity" >&2; exit 1 ;; esac
        for value in "$ADDRESS" "$SSH_USER" "$SSH_PRIVATE_KEY" "$SSH_HOST_KEY" "$WORKSPACE_DEVICE"; do
          test -n "$value"
        done
        case "$WORKSPACE_DEVICE" in /dev/disk/by-id/*) ;; *) echo "workspace device is not a stable by-id identity" >&2; exit 1 ;; esac
        if [ "$CAPACITY" = gpu ]; then
          test -n "$MODEL_CACHE_DEVICE" && test -n "$MODEL_CACHE_UUID"
          case "$MODEL_CACHE_DEVICE" in /dev/disk/by-id/*) ;; *) echo "model-cache device is not a stable by-id identity" >&2; exit 1 ;; esac
          test "$MODEL_CACHE_DEVICE" != "$WORKSPACE_DEVICE"
        else
          test -z "$MODEL_CACHE_DEVICE" && test -z "$MODEL_CACHE_UUID"
        fi
        key="$RUNNER_TEMP/forge-e2e-$CAPACITY-ed25519"
        host_key="$RUNNER_TEMP/forge-e2e-$CAPACITY-host.pub"
        umask 077
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
        printf '%s\n' "$SSH_HOST_KEY" > "$host_key"
        chmod 0600 "$key"
        ssh-keygen -y -f "$key" >/dev/null
        ssh-keygen -l -f "$host_key" >/dev/null
        {
          printf 'FORGE_E2E_PERMANENT_FIXTURE=true\n'
          printf 'FORGE_E2E_FIXTURE_ADDRESS=%s\n' "$ADDRESS"
          printf 'FORGE_E2E_FIXTURE_SSH_USER=%s\n' "$SSH_USER"
          printf 'FORGE_E2E_FIXTURE_SSH_KEY_PATH=%s\n' "$key"
          printf 'FORGE_E2E_FIXTURE_SSH_HOST_KEY=%s\n' "$SSH_HOST_KEY"
          printf 'FORGE_E2E_FIXTURE_WORKSPACE_DEVICE=%s\n' "$WORKSPACE_DEVICE"
          printf 'FORGE_E2E_MODEL_CACHE_DEVICE=%s\n' "$MODEL_CACHE_DEVICE"
          printf 'FORGE_E2E_MODEL_CACHE_UUID=%s\n' "$MODEL_CACHE_UUID"
        } >> "$GITHUB_ENV"
