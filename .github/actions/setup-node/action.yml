name: Set up pinned Node with immutable npm cache
description: Install an exact Node version and cache npm downloads by the selected lockfiles.
inputs:
  node-version:
    description: Exact Node patch version.
    required: true
  cache-dependency-path:
    description: Newline-separated package-lock.json paths that define the npm download cache.
    required: true
  cache-scope:
    description: Job-owner scope that prevents concurrent partial cache saves.
    required: true
runs:
  using: composite
  steps:
    - name: Install checksummed Node ${{ inputs.node-version }}
      uses: ./.github/actions/setup-ci-tool
      with:
        name: node
        version: ${{ inputs.node-version }}
    - name: Compute content-addressed npm cache key
      id: cache-key
      shell: bash
      env:
        DEPENDENCY_PATHS: ${{ inputs.cache-dependency-path }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        files=()
        while IFS= read -r path; do
          [ -z "$path" ] && continue
          [ -f "$path" ] || { echo "missing npm cache dependency: $path" >&2; exit 1; }
          files+=("$path")
        done <<< "$DEPENDENCY_PATHS"
        [ "${#files[@]}" -gt 0 ] || { echo "no npm cache dependencies supplied" >&2; exit 1; }
        digest=$(python3 "$GITHUB_WORKSPACE/.github/scripts/content_digest.py" "${files[@]}")
        key="${{ runner.os }}-${{ runner.arch }}-npm-node-$(node --version)-${{ inputs.cache-scope }}-${digest}"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        echo "npm cache key: $key"
        printf 'npm cache inputs:\n%s\n' "$DEPENDENCY_PATHS"
    - name: Restore exact npm download cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-key.outputs.path }}
        key: ${{ steps.cache-key.outputs.key }}
    - name: Report npm cache source
      shell: bash
      run: |
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "npm cache source: exact key ${{ steps.cache-key.outputs.key }}"
        else
          echo "npm cache source: cold (will save ${{ steps.cache-key.outputs.key }})"
        fi
