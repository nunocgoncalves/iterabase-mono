# Static private control-plane ingress fixture. Pair with values-tls.yaml and
# render as release `opo1` in namespace `portable-system`. The documentation
# addresses prove that the complete same-origin Dashboard/API host can use a
# private class without changing the separately public inference ingress.

metallb:
  enabled: true

metallb-config:
  enabled: true
  addresses:
    - "2001:db8:30::100-2001:db8:30::10f"
  additionalPools:
    - name: internal
      addresses:
        - "10.0.20.200-10.0.20.215"
      autoAssign: false
      avoidBuggyIPs: false
      interfaces:
        - eth0

ingress-nginx:
  controller:
    service:
      ipFamilyPolicy: SingleStack
      ipFamilies:
        - IPv6

internal-ingress-nginx:
  enabled: true
  controller:
    service:
      annotations:
        metallb.io/address-pool: opo1-internal
        metallb.io/loadBalancerIPs: 10.0.20.200
      ipFamilyPolicy: SingleStack
      ipFamilies:
        - IPv4

cert-issuers:
  letsencrypt:
    enabled: true
    email: operator@example.com

external-dns:
  enabled: true
  domainFilters:
    - example.com.

control-plane:
  ingress:
    enabled: true
    className: nginx-internal
    host: app.private.example.com
    tls:
      enabled: true
      # Intentionally leave secretName empty: the chart must derive a dedicated
      # edge Secret that cannot collide with the internal API serving leaf.
      clusterIssuer: letsencrypt-prod
    externalDns:
      enabled: true
      hostname: app.private.example.com
      target: 10.0.20.200
      cloudflareProxied: "false"
