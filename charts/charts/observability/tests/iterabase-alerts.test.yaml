rule_files:
  - rules.yaml
  - dashboard-rules.json

evaluation_interval: 1m

tests:
  - name: dashboard unknown outcomes preserves invocation-only results
    interval: 1m
    input_series:
      - series: 'control_plane_gateway_invocations_total{namespace="iterabase-system",effect_class="non_idempotent_write",result="outcome_unknown"}'
        values: '0 0 1 1 1 1'
    promql_expr_test:
      - expr: iterabase:dashboard_tool_runtime_unknown_outcomes
        eval_time: 4m
        exp_samples:
          - labels: '{__name__="iterabase:dashboard_tool_runtime_unknown_outcomes"}'
            value: 1

  - name: dashboard unknown outcomes includes the first recovery sample
    interval: 1m
    input_series:
      - series: 'control_plane_gateway_recoveries_total{namespace="iterabase-system",result="outcome_unknown"}'
        values: '1x6'
    promql_expr_test:
      - expr: iterabase:dashboard_tool_runtime_unknown_outcomes
        eval_time: 2m
        exp_samples:
          - labels: '{__name__="iterabase:dashboard_tool_runtime_unknown_outcomes"}'
            value: 1

  - name: critical expected target absence fires when the component series disappears completely
    interval: 1m
    input_series:
      - series: 'up{namespace="default",job="control-plane",component="manager"}'
        values: '1x8'
      - series: 'up{namespace="default",job="control-plane",component="gateway"}'
        values: '1x8'
      - series: 'up{namespace="default",job="control-plane",component="dispatch"}'
        values: '1x8'
      - series: 'up{namespace="default",job="control-plane",component="tool-materializer"}'
        values: '1x8'
      - series: 'up{namespace="default",job="control-plane",component="tool-runner"}'
        values: '1x8'
      - series: 'up{namespace="default",job="inference-gateway",component="inference-gateway"}'
        values: '1x8'
      - series: 'up{namespace="default",job="postgresql",component="postgresql"}'
        values: '1x8'
      - series: 'up{namespace="default",job="redis",component="redis"}'
        values: '1x8'
      - series: 'up{namespace="default",job="minio",component="minio"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: IterabasePlatformTargetAbsent
        exp_alerts:
          - exp_labels:
              namespace: default
              job: control-plane
              component: api
              severity: critical
            exp_annotations:
              summary: Expected api metrics target is absent
              description: Prometheus has no target series for this enabled platform component. Its process, Service endpoint, or monitor may have disappeared completely.
              first_action: Check the expected workload, Service endpoints, and ServiceMonitor/PodMonitor discovery.
              runbook_url: https://github.com/nunocgoncalves/iterabase-mono/blob/master/docs/runbooks/platform-alerts.md#iterabaseplatformtargetabsent

  - name: critical recovered unknown outcome fires from the first scraped counter value
    interval: 1m
    input_series:
      - series: 'control_plane_gateway_recoveries_total{namespace="iterabase-system",result="outcome_unknown"}'
        values: '1x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: IterabaseGatewayOutcomeUnknown
        exp_alerts:
          - exp_labels:
              namespace: iterabase-system
              result: outcome_unknown
              severity: critical
              component: gateway
            exp_annotations:
              summary: A tool invocation has an unknown external outcome
              description: A possible external effect lacks a committed result and must not be automatically repeated.
              first_action: Reconcile the durable invocation against the external system before any retry.
              runbook_url: https://github.com/nunocgoncalves/iterabase-mono/blob/master/docs/runbooks/platform-alerts.md#iterabasegatewayoutcomeunknown

  - name: critical harness disconnect fires after five minutes
    interval: 1m
    input_series:
      - series: 'control_plane_harness_dispatch_connected{namespace="iterabase-system",pod="worker-0"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: IterabaseHarnessDisconnected
        exp_alerts:
          - exp_labels:
              namespace: iterabase-system
              pod: worker-0
              severity: critical
              component: harness
            exp_annotations:
              summary: A harness supervisor is disconnected from dispatch
              description: The warm worker cannot receive durable assignments.
              first_action: Check the worker pod, dispatch Service, certificate validity, and reconnect logs.
              runbook_url: https://github.com/nunocgoncalves/iterabase-mono/blob/master/docs/runbooks/platform-alerts.md#iterabaseharnessdisconnected

  - name: critical harness disconnect resolves after reconnection
    interval: 1m
    input_series:
      - series: 'control_plane_harness_dispatch_connected{namespace="iterabase-system",pod="worker-0"}'
        values: '0x6 1x4'
    alert_rule_test:
      - eval_time: 8m
        alertname: IterabaseHarnessDisconnected
        exp_alerts: []

  - name: warning materialization failure threshold fires and resolves
    interval: 1m
    input_series:
      - series: 'tool_runner_materializations_total{namespace="iterabase-system",result="failure"}'
        values: '0 1 2 3 3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 9m
        alertname: IterabaseToolMaterializationFailures
        exp_alerts:
          - exp_labels:
              namespace: iterabase-system
              result: failure
              severity: warning
              component: tool-materializer
            exp_annotations:
              summary: Trusted-tool materialization is repeatedly failing
              description: Three or more Flux artifact materialization attempts failed in fifteen minutes.
              first_action: Inspect artifact digest, archive bounds, manifests, and materializer logs.
              runbook_url: https://github.com/nunocgoncalves/iterabase-mono/blob/master/docs/runbooks/platform-alerts.md#iterabasetoolmaterializationfailures
      - eval_time: 20m
        alertname: IterabaseToolMaterializationFailures
        exp_alerts: []
