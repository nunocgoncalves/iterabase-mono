{{- if .Values.enabled }}
{{- if (dig "internalTLS" "enabled" false (.Values.global | default (dict))) }}
{{- $kps := index .Values "kube-prometheus-stack" }}
{{- if (index $kps "enabled") }}
{{- $prometheus := index $kps "prometheus" }}
{{- $alertmanager := index $kps "alertmanager" }}
# kube-prometheus-stack owns the release-identity Prometheus and Alertmanager
# Services. Its config-reloader ports hard-code appProtocol=http even though the
# Operator passes each server's TLS configuration to the sidecar. Keep those
# upstream Services under upstream ownership and expose dedicated chart-owned
# scrape Services whose only port advertises the actual HTTPS protocol.
{{- if (index $prometheus "enabled") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.prometheusReloaderServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus-config-reloader
    iterabase.com/observability-reloader: prometheus
spec:
  ports:
    - name: reloader-web
      appProtocol: https
      port: {{ required "kube-prometheus-stack.prometheus.service.reloaderWebPort is required for internal TLS" (index $prometheus "service" "reloaderWebPort") }}
      targetPort: reloader-web
  selector:
    app.kubernetes.io/name: {{ ternary "prometheus-agent" "prometheus" (index $prometheus "agentMode") }}
    operator.prometheus.io/name: {{ include "observability.prometheusCRName" . }}
  type: ClusterIP
{{- end }}
{{- if and (index $prometheus "enabled") (index $alertmanager "enabled") }}
---
{{- end }}
{{- if (index $alertmanager "enabled") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.alertmanagerReloaderServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager-config-reloader
    iterabase.com/observability-reloader: alertmanager
spec:
  ports:
    - name: reloader-web
      appProtocol: https
      port: 8080
      targetPort: reloader-web
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: {{ include "observability.alertmanagerCRName" . }}
  type: ClusterIP
{{- end }}
{{- end }}
{{- end }}
{{- end }}
