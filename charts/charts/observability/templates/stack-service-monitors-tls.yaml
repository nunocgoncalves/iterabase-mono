{{- if .Values.enabled }}
{{- if (dig "internalTLS" "enabled" false (.Values.global | default (dict))) }}
{{- $ns := .Release.Namespace }}
{{- $release := .Release.Name }}
{{- $prometheusService := include "observability.prometheusServiceName" . }}
{{- $alertmanagerService := include "observability.alertmanagerServiceName" . }}
{{- if (index .Values "kube-prometheus-stack" "enabled") }}
# The Prometheus Operator passes each server's web TLS configuration to its
# config-reloader sidecar as well. Disable the upstream all-one-scheme monitors
# and own both verified HTTPS endpoints explicitly.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $release }}-prometheus-internal-tls
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ $ns | quote }}]
  selector:
    matchLabels:
      app: kube-prometheus-stack-prometheus
      release: {{ $release | quote }}
  endpoints:
    - port: http-web
      path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: observability-prometheus-tls
            key: ca.crt
        serverName: {{ printf "%s.%s.svc" $prometheusService $ns | quote }}
        insecureSkipVerify: false
    - port: reloader-web
      path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: observability-prometheus-tls
            key: ca.crt
        serverName: {{ printf "%s.%s.svc" $prometheusService $ns | quote }}
        insecureSkipVerify: false
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $release }}-alertmanager-internal-tls
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ $ns | quote }}]
  selector:
    matchLabels:
      app: kube-prometheus-stack-alertmanager
      release: {{ $release | quote }}
  endpoints:
    - port: http-web
      path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: observability-alertmanager-tls
            key: ca.crt
        serverName: {{ printf "%s.%s.svc" $alertmanagerService $ns | quote }}
        insecureSkipVerify: false
    - port: reloader-web
      path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: observability-alertmanager-tls
            key: ca.crt
        serverName: {{ printf "%s.%s.svc" $alertmanagerService $ns | quote }}
        insecureSkipVerify: false
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $release }}-grafana-internal-tls
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ $ns | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ $release }}
  endpoints:
    - port: http-web
      path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: observability-grafana-tls
            key: ca.crt
        serverName: {{ printf "%s-grafana.%s.svc" $release $ns | quote }}
        insecureSkipVerify: false
{{- end }}
{{- if .Values.loki.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $release }}-loki-internal-tls
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ $ns | quote }}]
  selector:
    matchLabels:
      iterabase.com/observability-backend: loki
    matchExpressions:
      # The Loki chart propagates singleBinary.service.labels to its shared
      # headless Service. That Service also selects the HTTP-only canary; only
      # the release-scoped client Service is the TLS backend identity.
      - key: variant
        operator: DoesNotExist
  endpoints:
    - port: http-metrics
      path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: observability-loki-tls
            key: ca.crt
        serverName: {{ printf "%s-loki.%s.svc" $release $ns | quote }}
        insecureSkipVerify: false
{{- end }}
{{- end }}
{{- end }}
