{{- if and .Values.enabled (index .Values "kube-prometheus-stack" "enabled") }}
{{- range $path, $bytes := .Files.Glob "dashboards/iterabase-*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Iterabase
data:
  {{ base $path }}: |-
{{ $bytes | toString | nindent 4 }}
---
{{- end }}
{{- range $path, $bytes := .Files.Glob "dashboards/infrastructure/iterabase-*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Infrastructure
data:
  {{ base $path }}: |-
{{ $bytes | toString | nindent 4 }}
---
{{- end }}
{{- range $path, $bytes := .Files.Glob "dashboards/observability/iterabase-*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Observability
data:
  {{ base $path }}: |-
{{ $bytes | toString | nindent 4 }}
---
{{- end }}
{{- end }}
