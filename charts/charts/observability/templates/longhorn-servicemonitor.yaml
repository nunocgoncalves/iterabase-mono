{{- if and .Values.enabled .Values.alerts.enabled (index .Values "kube-prometheus-stack" "enabled") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-longhorn-manager" .Release.Name }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  namespaceSelector:
    matchNames: [longhorn-system]
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
{{- end }}
