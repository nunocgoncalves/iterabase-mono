{{- if .Values.enabled }}
{{- if (index .Values "kube-prometheus-stack" "enabled") }}
# Loki datasource for Grafana. Loaded by the kube-prometheus-stack Grafana
# datasource sidecar (label grafana_datasource=1), alongside the stack's own
# Prometheus datasource. Keeps the Loki URL release-templated (the sidecar
# approach avoids templating a static additionalDataSources URL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-loki-datasource
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: {{ include "observability.lokiURL" . }}
        isDefault: false
        jsonData:
          maxLines: 1000
          {{- if (dig "internalTLS" "enabled" false (.Values.global | default (dict))) }}
          # Grafana's process trust store contains the generated internal CA.
          tlsSkipVerify: false
          {{- end }}
{{- end }}
{{- end }}
