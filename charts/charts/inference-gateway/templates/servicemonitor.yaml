{{- if and .Values.enabled .Values.metrics.enabled }}
# Dedicated plaintext in-cluster metrics listener. The public API ingress and
# supervisor mTLS workload listener never serve /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "inference-gateway.name" . }}
  labels:
    {{- include "inference-gateway.labels" . | nindent 4 }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval | default "30s" }}
      relabelings:
        - action: replace
          replacement: inference-gateway
          targetLabel: component
{{- end }}
