{{- /*
Recover the aliased ingress-nginx admission webhook before Helm reapplies
regular resources after an interrupted feature-enable upgrade. The upstream
chart creates the serving Secret in a pre-install/pre-upgrade hook but patches
the ValidatingWebhookConfiguration only post-install/post-upgrade. If Helm
fails while waiting for workloads, that post hook never runs and the existing
empty/stale webhook blocks the next apply.

Render only when lookup proves that a webhook from an earlier attempt exists.
The upstream weight-0 hooks then recreate RBAC and ensure the stable serving
Secret before this weight-1 job reuses the pinned certgen patch command. A new
installation remains entirely on the upstream create/post-patch path.
DES-HOR-506-02 keeps failurePolicy=Fail throughout.
*/ -}}
{{- $internal := index .Values "internal-ingress-nginx" -}}
{{- $controller := index $internal "controller" -}}
{{- $admission := index $controller "admissionWebhooks" -}}
{{- $patch := index $admission "patch" -}}
{{- $certManager := index $admission "certManager" -}}
{{- if and (index $internal "enabled") (index $admission "enabled") (index $patch "enabled") (not (index $certManager "enabled")) -}}
{{- $name := default "internal-ingress-nginx" (index $internal "nameOverride") -}}
{{- $fullname := "" -}}
{{- if (index $internal "fullnameOverride") -}}
  {{- $fullname = (index $internal "fullnameOverride") | trunc 63 | trimSuffix "-" -}}
{{- else if contains $name .Release.Name -}}
  {{- $fullname = .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- else -}}
  {{- $fullname = printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- $admissionName := printf "%s-%s" $fullname (default "admission" (index $admission "name")) | trunc 63 | trimSuffix "-" -}}
{{- $existingWebhook := lookup "admissionregistration.k8s.io/v1" "ValidatingWebhookConfiguration" "" $admissionName -}}
{{- if $existingWebhook -}}
{{- $namespace := default .Release.Namespace (index $internal "namespaceOverride") | trunc 63 | trimSuffix "-" -}}
{{- $serviceAccount := index $patch "serviceAccount" -}}
{{- $serviceAccountName := "default" -}}
{{- if (index $serviceAccount "create") -}}
  {{- $serviceAccountName = default $admissionName (index $serviceAccount "name") -}}
{{- else -}}
  {{- $serviceAccountName = default "default" (index $serviceAccount "name") -}}
{{- end -}}
{{- $image := index $patch "image" -}}
{{- $repository := index $image "repository" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-recovery" $admissionName | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: internal-ingress-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admission-webhook-recovery
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ttlSecondsAfterFinished: 0
  {{- with (index $admission "patchWebhookJob" "activeDeadlineSeconds") }}
  {{- if gt (int .) 0 }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-ingress-nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: admission-webhook-recovery
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $serviceAccountName }}
      automountServiceAccountToken: {{ index $serviceAccount "automountServiceAccountToken" }}
      containers:
        - name: patch
          image: {{ if $repository }}{{ $repository }}{{ else }}{{ default "registry.k8s.io" (index $image "registry") }}/{{ index $image "image" }}{{ end }}:{{ index $image "tag" }}{{ with (index $image "digest") }}@{{ . }}{{ end }}
          imagePullPolicy: {{ index $image "pullPolicy" }}
          args:
            - patch
            - --webhook-name={{ $admissionName }}
            - --namespace=$(POD_NAMESPACE)
            - --patch-mutating=false
            - --secret-name={{ $admissionName }}
            - --patch-failure-policy={{ index $admission "failurePolicy" }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- with (index $admission "extraEnvs") }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (index $admission "patchWebhookJob" "securityContext") }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (index $admission "patchWebhookJob" "resources") }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with (index $patch "priorityClassName") }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with (index $patch "runtimeClassName") }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with (index $patch "nodeSelector") }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (index $patch "tolerations") }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (index $patch "securityContext") }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
{{- end -}}
