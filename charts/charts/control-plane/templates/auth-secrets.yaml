{{- if and .Values.enabled .Values.auth.enabled }}
{{- if not .Values.auth.bootstrap.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "control-plane.authBootstrapSecretName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.bootstrap.emailKey | default "admin-email" }}: {{ required "auth.bootstrap.adminEmail is required when auth.enabled" .Values.auth.bootstrap.adminEmail | quote }}
  {{ .Values.auth.bootstrap.localeKey | default "admin-locale" }}: {{ .Values.auth.bootstrap.adminLocale | default "en" | quote }}
{{- end }}
{{- if and .Values.auth.email.username (not .Values.auth.email.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "control-plane.authEmailSecretName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
type: Opaque
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "control-plane.authEmailSecretName" .) }}
{{- if $existing }}
data:
{{- range $k, $v := $existing.data }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- else }}
stringData:
  {{ .Values.auth.email.passwordKey | default "smtp-password" }}: {{ randAlphaNum 32 | quote }}
{{- end }}
{{- end }}
{{- end }}
