{{- if and .Values.enabled .Values.dispatch.enabled .Values.dispatch.tls.generated }}
{{- $caName := include "control-plane.spiffeCASecretName" . }}
{{- $tlsName := include "control-plane.dispatchTLSSecretName" . }}
# The dispatch Work server is a sibling mTLS workload service of the gateway:
# its serving leaf is signed by the same shared platform workload CA
# (platform-spiffe-ca) that AgentPool worker leaves are issued from — so a warm
# worker (which verifies the server chain against that CA) accepts it — and it
# trusts that same CA as its client CA (DISPATCH_CLIENT_CA_FILE). The CA Secret
# + ClusterIssuer are provisioned in gateway-tls.yaml whenever either the
# gateway or dispatch is enabled.
{{- $existingCA := lookup "v1" "Secret" .Release.Namespace $caName }}
{{- $ca := genCA (printf "%s platform workload CA" .Release.Name) 3650 }}
{{- if $existingCA }}
{{- $ca = buildCustomCert (index $existingCA.data "tls.crt") (index $existingCA.data "tls.key") }}
{{- end }}
{{- $existingTLS := lookup "v1" "Secret" .Release.Namespace $tlsName }}
{{- $dispatchName := include "control-plane.dispatchName" . }}
{{- $dnsNames := list $dispatchName (printf "%s.%s" $dispatchName .Release.Namespace) (printf "%s.%s.svc" $dispatchName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $dispatchName .Release.Namespace) }}
{{- $dispatchCert := genSignedCert $dispatchName nil $dnsNames 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatch
type: kubernetes.io/tls
data:
{{- if $existingTLS }}
{{- range $k, $v := $existingTLS.data }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- else }}
  tls.crt: {{ $dispatchCert.Cert | b64enc | quote }}
  tls.key: {{ $dispatchCert.Key | b64enc | quote }}
{{- end }}
{{- end }}
