{{- if .Values.enabled }}
{{- if .Values.metrics.enabled }}
{{- $tls := (or .Values.tls.enabled (dig "internalTLS" "enabled" false (.Values.global | default (dict)))) }}
{{- $auth := eq (include "redis.authEnabled" .) "true" }}
{{- $caSecret := (printf "%s-internal-ca-root" .Release.Name) }}
{{- $name := (printf "%s-redis-exporter" .Release.Name) }}
# redis-exporter: standalone Deployment + Service + ServiceMonitor. Separate pod
# (not a sidecar) per Prometheus exporter best practice. Connects with the AUTH
# password (mounted as a file) and the internal CA when TLS is on. The exporter
# pods carry component=exporter (distinct from the redis server's component=cache)
# so the main redis Service never selects them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: exporter
    spec:
      {{- if $tls }}
      volumes:
        - name: internal-ca
          secret:
            secretName: {{ $caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
      containers:
        - name: redis-exporter
          image: '{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}@{{ required "metrics.image.digest is required" .Values.metrics.image.digest }}'
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          # redis_exporter v1.67.0 has no --tls flag ("flag provided but not
          # defined: -tls" -> CrashLoop). Enable TLS via the rediss:// scheme on
          # --redis.addr and verify the server cert with --tls-ca-cert-file.
          # --redis.password-file expects a JSON password array on v1.67.0 (not
          # the raw Secret), so pass the runtime password via --redis.password with
          # K8s $(VAR) arg expansion from the REDIS_PASSWORD env var (no shell —
          # the image is distroless). The umbrella's global internal-TLS mode
          # implies AUTH for the Redis server, so it must imply exporter AUTH too;
          # standalone tls.enabled still remains independent from auth.enabled.
          args:
            - --redis.addr={{ if $tls }}rediss://{{ end }}{{ include "redis.name" . }}:6379
            {{- if $tls }}
            - --tls-ca-cert-file={{ .Values.tls.caMountPath }}
            {{- end }}
            {{- if $auth }}
            - --redis.password=$(REDIS_PASSWORD)
            {{- end }}
          {{- if $auth }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redis.secretName" . }}
                  key: redis-password
          {{- end }}
          ports:
            - name: http-metrics
              containerPort: 9121
          {{- if $tls }}
          volumeMounts:
            - name: internal-ca
              mountPath: {{ dir .Values.tls.caMountPath }}
              readOnly: true
          {{- end }}
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: exporter
  ports:
    - name: http-metrics
      port: 9121
      targetPort: http-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "redis.name" . }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval | default "30s" }}
      relabelings:
        - action: replace
          replacement: redis
          targetLabel: component
{{- end }}
{{- end }}
