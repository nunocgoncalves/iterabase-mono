{{- if and .Values.enabled .Values.artifactService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.artifactSecretName" . }}
  labels:
    {{- include "minio.artifactLabels" . | nindent 4 }}
type: Opaque
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "minio.artifactSecretName" .) }}
{{- if $existing }}
data:
{{- range $k, $v := $existing.data }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- else }}
stringData:
  accessKey: {{ randAlphaNum 20 | quote }}
  secretKey: {{ randAlphaNum 40 | quote }}
{{- end }}
{{- end }}
