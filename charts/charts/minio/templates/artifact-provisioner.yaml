{{- if and .Values.enabled .Values.artifactService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minio.name" . }}-artifact-policy
  labels:
    {{- include "minio.artifactLabels" . | nindent 4 }}
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
          "Resource": ["arn:aws:s3:::{{ .Values.artifactService.bucket }}"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
          "Resource": ["arn:aws:s3:::{{ .Values.artifactService.bucket }}/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "minio.name" . }}-artifact-provisioner-{{ .Chart.Version | replace "." "-" }}
  labels:
    {{- include "minio.artifactLabels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "minio.artifactLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: "{{ .Values.artifactService.mcImage.repository }}:{{ .Values.artifactService.mcImage.tag }}"
          imagePullPolicy: {{ .Values.artifactService.mcImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set local http://{{ include "minio.name" . }}:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing "local/$ARTIFACT_BUCKET"
              mc admin user add local "$ARTIFACT_ACCESS_KEY" "$ARTIFACT_SECRET_KEY"
              mc admin policy create local artifact-service /policy/policy.json
              mc admin policy attach local artifact-service --user "$ARTIFACT_ACCESS_KEY"
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" . }}
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" . }}
                  key: rootPassword
            - name: ARTIFACT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.artifactSecretName" . }}
                  key: accessKey
            - name: ARTIFACT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.artifactSecretName" . }}
                  key: secretKey
            - name: ARTIFACT_BUCKET
              value: {{ .Values.artifactService.bucket | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: policy
              mountPath: /policy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policy
          configMap:
            name: {{ include "minio.name" . }}-artifact-policy
{{- end }}
