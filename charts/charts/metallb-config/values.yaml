enabled: true

# MetalLB L2 config. The MetalLB operator (controller + speaker + CRDs) is the
# umbrella's community `metallb` dep (gated by metallb.enabled); this subchart
# only renders the IPAddressPool + L2Advertisement CRs the operator reconciles.
# Enable metallb + metallb-config together in the overlay (kind preset / OPO1);
# on cloud leave both off and let the cloud LB provision ingress Services.
#
# Backward-compatible primary edge pool. Its resource identity remains
# `<release>-edge`, preserving existing allocations across a chart upgrade.
# CIDR (10.0.0.0/28) or range (10.0.0.10-10.0.0.20); family must match the
# primary ingress-nginx Service.
addresses: []
autoAssign: true
avoidBuggyIPs: false
# Empty = announce the primary edge pool on all node interfaces.
interfaces: []

# Additional class-isolated ingress pools. Each entry renders an IPAddressPool
# and L2Advertisement named `<release>-<name>`. Private pools should normally
# disable auto-assignment so only Services explicitly selecting the pool can
# consume an address, and should constrain L2 advertisements to the private
# VLAN interface on multi-homed nodes.
additionalPools: []
# - name: internal
#   addresses:
#     - 10.0.20.200-10.0.20.215
#   autoAssign: false
#   avoidBuggyIPs: false
#   interfaces:
#     - eth0
