{{- if .Values.enabled }}
{{- if .Values.addresses }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  # Ordinary release resource (DES-HOR-511-01): the reusable platform chart's
  # MetalLB CRDs are established and verified by the Forge CRD pre-apply stage
  # before Helm applies this resource, so no post-install/post-upgrade hook
  # lifecycle (which deleted and recreated the pool each upgrade) is needed.
  # resource-policy: keep (DES-HOR-511-05) keeps this instance (the VIP config
  # data) from being deleted by disable, uninstall, upgrade, or rollback; kept
  # resources are still updated in place on upgrade.
  annotations:
    helm.sh/resource-policy: keep
  name: {{ include "metallb-config.name" . }}
  labels:
    {{- include "metallb-config.labels" . | nindent 4 }}
spec:
  addresses:
    {{- toYaml .Values.addresses | nindent 4 }}
  autoAssign: {{ .Values.autoAssign }}
  avoidBuggyIPs: {{ .Values.avoidBuggyIPs }}
{{- end }}
{{- range $pool := .Values.additionalPools }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ include "metallb-config.additionalPoolName" (dict "root" $ "pool" $pool) }}
  labels:
    {{- include "metallb-config.labels" $ | nindent 4 }}
    iterabase.com/metallb-pool: {{ required "metallb-config.additionalPools[].name is required" $pool.name | quote }}
spec:
  addresses:
    {{- required (printf "metallb-config.additionalPools[%s].addresses is required" (required "metallb-config.additionalPools[].name is required" $pool.name)) $pool.addresses | toYaml | nindent 4 }}
  autoAssign: {{ $pool.autoAssign | default false }}
  avoidBuggyIPs: {{ $pool.avoidBuggyIPs | default false }}
{{- end }}
{{- end }}
