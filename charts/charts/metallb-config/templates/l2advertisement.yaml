{{- if .Values.enabled }}
{{- if .Values.addresses }}
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  # Ordinary release resource (DES-HOR-511-01); see ipaddresspool.yaml. Kept
  # (DES-HOR-511-05) so the advertisement (VIP config data) survives disable,
  # uninstall, upgrade, and rollback; still updated in place on upgrade.
  annotations:
    helm.sh/resource-policy: keep
  name: {{ include "metallb-config.name" . }}
  labels:
    {{- include "metallb-config.labels" . | nindent 4 }}
spec:
  ipAddressPools:
    - {{ include "metallb-config.name" . }}
  {{- with .Values.interfaces }}
  interfaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $pool := .Values.additionalPools }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ include "metallb-config.additionalPoolName" (dict "root" $ "pool" $pool) }}
  labels:
    {{- include "metallb-config.labels" $ | nindent 4 }}
    iterabase.com/metallb-pool: {{ required "metallb-config.additionalPools[].name is required" $pool.name | quote }}
spec:
  ipAddressPools:
    - {{ include "metallb-config.additionalPoolName" (dict "root" $ "pool" $pool) }}
  {{- with $pool.interfaces }}
  interfaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
