# DES-HOR-545-01: fixed OpenEBS LVM LocalPV 1.10.0 substrate for K3s.
# These values are release-owned, not an overlay-selectable storage backend.
lvm-localpv:
  enabled: true
  global:
    analytics:
      enabled: false
    kubeletDir: /var/lib/kubelet
  analytics:
    enabled: false
  storageCapacity: true
  crds:
