# DES-HOR-545-01: fixed OpenEBS LVM LocalPV 1.10.0 substrate for K3s.
# These values are release-owned, not an overlay-selectable storage backend.
#
# agentpool.authorizedManagerIdentity is set by Forge on install (and by the
# E2E harness) to the exact userInfo.username of the control-plane manager
# (system:serviceaccount:<ns>:<platform-release>-control-plane-manager). It is
# deliberately required with an empty default so the chart fails closed rather
# than emitting a broken admission gate.
agentpool:
  authorizedManagerIdentity: ""
lvm-localpv:
  enabled: true
  global:
    analytics:
      enabled: false
    kubeletDir: /var/lib/kubelet
  analytics:
    enabled: false
  storageCapacity: true
  crds:
    lvmLocalPv:
      enabled: true
      keep: true
    csi:
      volumeSnapshots:
        enabled: true
        keep: true
  lvmNode:
    kubeletDir: /var/lib/kubelet
    driverRegistrar:
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.13.0@sha256:d7138bcc3aa5f267403d45ad4292c95397e421ea17a0035888850f424c7de25d
  serviceAccount:
    lvmController:
      # The parent chart owns narrowed controller/snapshot RBAC. Disabling only
      # the upstream RBAC rendering keeps the reviewed controller SA name while
      # avoiding its unneeded cluster-wide Secret and CRD mutation privileges.
      create: false
      name: openebs-lvm-controller-sa
  lvmController:
    replicas: 1
    resizer:
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/csi-resizer
        tag: v2.0.0@sha256:4a95d94e57ad82f6977cd8d4fdcfcfc0b83f02d990e4e7715b688c20970a906d
    snapshotter:
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.2.0@sha256:dd788d79cf4c1b8edee6d9b80b8a1ebfc51a38a365c5be656986b129be9ac784
    snapshotController:
      enabled: true
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/snapshot-controller
        tag: v8.2.0@sha256:9dade8f2f3ab29e3919c41b343f8d77b12178ac51f25574d7ed2d45a3e3ef69d
    provisioner:
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.1.0@sha256:e5900dc98b0d02f317ea9572f3824983c47a2fb5d5fe2b160aedf1b99c14c9e4
  lvmPlugin:
    image:
      registry: ""
      repository: docker.io/openebs/lvm-driver
      tag: 1.10.0@sha256:b5932b4df5cde1f72914f665a4e4b480afd38dbc6577d7552b9f509d52e8c094
    metricsPort: 9500
    allowedTopologies: "kubernetes.io/hostname,"
