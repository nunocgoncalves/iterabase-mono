{{- if .Values.enabled }}
{{- if .Values.metrics.enabled }}
{{- $tls := (or .Values.tls.enabled (dig "internalTLS" "enabled" false (.Values.global | default (dict)))) }}
{{- $caSecret := (printf "%s-internal-ca-root" .Release.Name) }}
{{- $sslmode := "disable" -}}
{{- if $tls -}}{{- $sslmode = "verify-full" -}}{{- end -}}
{{- $name := (printf "%s-postgresql-exporter" .Release.Name) }}
# postgres-exporter: standalone Deployment + Service + ServiceMonitor. Separate
# pod (not a sidecar) per Prometheus exporter best practice. Builds the DSN at
# runtime from the chart-generated password Secret (so the password is never
# baked into the chart) and the internal CA when TLS is on. The exporter pods
# carry component=exporter (distinct from the postgres server's
# component=database) so the main postgresql Service never selects them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: exporter
    spec:
      volumes:
        - name: pg-secret
          secret:
            secretName: {{ include "postgresql.secretName" . }}
            items:
              - key: password
                path: password
        {{- if $tls }}
        - name: internal-ca
          secret:
            secretName: {{ $caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      containers:
        - name: postgres-exporter
          image: '{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}@{{ required "metrics.image.digest is required" .Values.metrics.image.digest }}'
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          # Build DATA_SOURCE_NAME at runtime from the mounted password file so
          # the generated password is never templated into the chart. The DSN
          # user/db come from the chart's auth values (defaults: gateway/gateway;
          # the control-plane overrides to controlplane/controlplane).
          # postgres-exporter v0.15.0 dropped the --data-source-name CLI flag
          # ("unknown long flag" -> CrashLoop); it reads the DSN from the
          # DATA_SOURCE_NAME env var instead.
          command:
            - sh
            - -c
            - |
              export DATA_SOURCE_NAME="postgresql://{{ .Values.auth.username }}:$(cat /etc/pg/password)@{{ include "postgresql.name" . }}:5432/{{ .Values.auth.database }}?sslmode={{ $sslmode }}{{ if $tls }}&sslrootcert={{ .Values.tls.caMountPath }}{{ end }}"
              exec postgres_exporter
          ports:
            - name: http-metrics
              containerPort: 9187
          volumeMounts:
            - name: pg-secret
              mountPath: /etc/pg
              readOnly: true
            {{- if $tls }}
            - name: internal-ca
              mountPath: {{ dir .Values.tls.caMountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: exporter
  ports:
    - name: http-metrics
      port: 9187
      targetPort: http-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "postgresql.name" . }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval | default "30s" }}
      relabelings:
        - action: replace
          replacement: postgresql
          targetLabel: component
{{- end }}
{{- end }}
