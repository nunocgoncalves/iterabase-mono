# TLS-on preset for the iterabase-platform umbrella (CI: static kubeconform via
# `make check-tls` + the live `install-tls` kind e2e). Flips the shared switch
# for every supported internal-CA service link. AgentPool workspace storage is
# local ext4/XFS configured by Forge and adds no service transport. kind/E2E stays
# plaintext by default (this file is opt-in).
global:
  internalTLS:
    enabled: true

# Reloader restarts the TLS-serving workloads when cert-manager renews their
# mounted cert Secrets (see charts/iterabase-platform/values.yaml).
reloader:
  enabled: true

# --- Observability stack: TLS serving (HOR-408 / F6) ---
# Consumes global.internalTLS: the observability chart renders the stack-
# component leaf Certificates (stack-internal-tls.yaml, signed by the internal
# CA) when internalTLS is on; this preset points the upstream kube-prometheus-
# stack/loki charts at those certs so Prometheus/Grafana/Loki/Alertmanager serve
# HTTPS, and switches the Grafana datasources to https (the observability chart
# renders https datasources when internalTLS is on; the kps default http://
# datasources are disabled here because their scheme is hardcoded, not value-
# overridable). Cert Secret names are FIXED (single-tenant, once-per-cluster).
observability:
  kube-prometheus-stack:
    prometheus:
      # The upstream Service remains kube-prometheus-stack-owned. The
      # observability chart separately exposes and monitors the TLS-enabled
      # config-reloader through an HTTPS-advertising scrape Service.
      serviceMonitor:
        selfMonitor: false
      prometheusSpec:
        # The upstream default Alertmanager endpoint cannot template a TLS
        # serverName from the actual release. Replace it with the chart-owned
        # additional config Secret, which derives both target and identity from
        # .Release.Name/.Release.Namespace.
        disableAlerting: true
        additionalAlertManagerConfigsSecret:
          name: '{{ .Release.Name }}-prometheus-alertmanager-tls-config'
          key: additional-alertmanager-configs.yaml
        secrets:
          - observability-alertmanager-tls
        web:
          tlsConfig:
            cert:
              secret:
                name: observability-prometheus-tls
                key: tls.crt
            keySecret:
              name: observability-prometheus-tls
              key: tls.key
    alertmanager:
      # As with Prometheus, keep the upstream Service and use a dedicated
      # HTTPS-advertising scrape Service for the TLS-enabled config-reloader.
      serviceMonitor:
        selfMonitor: false
      alertmanagerSpec:
        web:
          tlsConfig:
            cert:
              secret:
                name: observability-alertmanager-tls
                key: tls.crt
            keySecret:
              name: observability-alertmanager-tls
              key: tls.key
    grafana:
      # Disable the upstream HTTP self-monitor and default datasources. The
      # observability chart owns their verified-HTTPS replacements.
      serviceMonitor:
        enabled: false
      sidecar:
        datasources:
          defaultDatasourceEnabled: false
          alertmanager:
            enabled: false
          reloadURL: https://localhost:3000/api/admin/provisioning/datasources/reload
          # Grafana can start after the sidecar's initial list. Keep that
          # one-shot reload request alive until the HTTPS listener is Ready.
          maxTotalRetries: 10
          maxConnectRetries: 10
          env:
            REQUESTS_CA_BUNDLE: /etc/grafana/tls/ca.crt
          extraMounts:
            - name: grafana-tls
              mountPath: /etc/grafana/tls
              readOnly: true
        dashboards:
          reloadURL: https://localhost:3000/api/admin/provisioning/dashboards/reload
          maxTotalRetries: 10
          maxConnectRetries: 10
          env:
            REQUESTS_CA_BUNDLE: /etc/grafana/tls/ca.crt
          extraMounts:
            - name: grafana-tls
              mountPath: /etc/grafana/tls
              readOnly: true
      # Serve HTTPS and add the generated CA to Grafana's process trust store so
      # datasource health checks validate the actual Service identities.
      env:
        GF_SERVER_PROTOCOL: https
        GF_SERVER_CERT_FILE: /etc/grafana/tls/tls.crt
        GF_SERVER_CERT_KEY: /etc/grafana/tls/tls.key
        SSL_CERT_FILE: /etc/grafana/tls/ca.crt
      extraSecretMounts:
        - name: grafana-tls
          secretName: observability-grafana-tls
          mountPath: /etc/grafana/tls
          readOnly: true
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
          scheme: HTTPS
      livenessProbe:
        httpGet:
          path: /api/health
          port: grafana
          scheme: HTTPS
  # Promtail verifies Loki against the internal CA and the release-scoped
  # Service DNS identity. The CA comes from the Loki leaf Secret and is mounted
  # read-only; no insecure positive path remains.
  promtail:
    extraVolumes:
      - name: internal-ca
        secret:
          secretName: observability-loki-tls
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: internal-ca
        mountPath: /etc/iterabase/internal-ca
        readOnly: true
    config:
      clients:
        - url: https://{{ .Release.Name }}-loki:3100/loki/api/v1/push
          tls_config:
            ca_file: /etc/iterabase/internal-ca/ca.crt
            server_name: '{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc'
            insecure_skip_verify: false
  loki:
    # structuredConfig lives under the loki chart's nested `loki:` value
    # (.Values.loki.structuredConfig), so the path from the observability chart
    # is loki.loki.structuredConfig. mergedConfig = mergeOverwrite(loki.config,
    # loki.structuredConfig), so http_tls_* lands in the server block.
    loki:
      # Probes must use HTTPS once the server serves TLS (default is HTTP).
      readinessProbe:
        httpGet:
          path: /ready
          port: http-metrics
          scheme: HTTPS
        periodSeconds: 10
        initialDelaySeconds: 15
      livenessProbe:
        httpGet:
          path: /ready
          port: http-metrics
          scheme: HTTPS
      structuredConfig:
        server:
          http_tls_config:
            cert_file: /etc/loki/tls/tls.crt
            key_file: /etc/loki/tls/tls.key
    singleBinary:
      service:
        labels:
          iterabase.com/observability-backend: loki
      extraVolumes:
        - name: loki-tls
          secret:
            secretName: observability-loki-tls
      extraVolumeMounts:
        - name: loki-tls
          mountPath: /etc/loki/tls
          readOnly: true
    gateway:
      nginxConfig:
        schema: https
        locationSnippet: |-
          proxy_ssl_trusted_certificate /etc/iterabase/internal-ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc.cluster.local;
      extraVolumes:
        - name: internal-ca
          secret:
            secretName: observability-loki-tls
            items:
              - key: ca.crt
                path: ca.crt
      extraVolumeMounts:
        - name: internal-ca
          mountPath: /etc/iterabase/internal-ca
          readOnly: true
