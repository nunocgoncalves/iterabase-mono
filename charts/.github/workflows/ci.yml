name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: install kubeconform
        run: |
          curl -sLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: helm repo add external chart repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
      - name: check (lint + template + kubeconform)
        run: make check
      - name: check-tls (static render + kubeconform with internal TLS on)
        run: make check-tls

  certificate-ownership-migration:
    # Platform <=0.2.2 owned cert-manager/CSI inside the umbrella release. Prove
    # the 0.3.0 platform-first hand-off and inverse rollback against the actual
    # released chart so fresh-install-only CI cannot hide Helm ownership clashes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.24.0
      - name: helm repo add external chart repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
      - name: build local 0.3.0 chart dependencies
        run: make build-deps
      - name: validate 0.2.2 ownership hand-off and rollback
        run: ./scripts/check-certificate-migration.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.24.0
      - name: helm repo add external chart repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
      - name: build deps (nested charts, certificate substrate, then umbrella)
        run: |
          helm dependency build charts/control-plane
          helm dependency build charts/cert-manager-substrate
          helm dependency build charts/iterabase-platform
      - name: compute MetalLB pool from the kind docker-bridge subnet
        run: |
          # The edge is a LoadBalancer Service; on kind, MetalLB L2 allocates the
          # LB IP from a pool in the `kind` docker-bridge subnet (reachable from
          # the runner host). The kind network is often dual-stack — enumerate
          # all subnets and prefer IPv4 (simpler reachability from the host). Use
          # the top of the /16 so it doesn't collide with the kind node's low
          # container IPs.
          subnets=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}}{{"\n"}}{{end}}')
          echo "kind subnets: $subnets"
          subnet=$(echo "$subnets" | grep -E '^[0-9]+\.' | head -1)
          if [ -z "$subnet" ]; then
            echo "::error::kind network has no IPv4 subnet ($(echo "$subnets" | tr '\n' ' '))"
            exit 1
          fi
          base=$(echo "$subnet" | cut -d. -f1-2)
          echo "using IPv4 subnet $subnet -> pool base $base"
          cat > /tmp/kind-edge.yaml <<EOF
          metallb:
            enabled: true
          metallb-config:
            enabled: true
            addresses:
              - ${base}.255.200-${base}.255.250
          EOF
          cat /tmp/kind-edge.yaml
      - name: install umbrella (LoadBalancer edge + MetalLB + TLS for kind)
        run: |
          # The ordered substrate release establishes cert-manager first. The
          # platform then renders the public edge: ingress-nginx (LoadBalancer),
          # cert-issuers (self-signed), and the gateway Ingress (host + TLS).
          # MetalLB (from /tmp/kind-edge.yaml) provides the LB impl; the
          # metallb-config CRs (post-install hooks) allocate the pool. external-dns
          # is off (no real Cloudflare zone in kind). The generic chart job has
          # no Flux source or cross-repository runner image; use the published
          # control-plane tag until 0.0.19 is released, while the dedicated
          # kind+Flux contract validates the new enabled path.
          helm install iterabase-cert-manager charts/cert-manager-substrate \
            --create-namespace -n iterabase-system \
            --wait --timeout 5m
          helm install iterabase charts/iterabase-platform \
            -n iterabase-system \
            -f /tmp/kind-edge.yaml \
            --set external-dns.enabled=false \
            --set control-plane.image.tag=0.0.18 \
            --set control-plane.toolRunner.enabled=false \
            --set control-plane.dispatch.defaultModel.id=test-model \
            --set control-plane.dispatch.defaultModel.api=test \
            --wait --timeout 12m
      - name: validate control-plane manager CRDs, RBAC, and cache stability
        run: |
          set -euo pipefail
          ns=iterabase-system
          deployment=iterabase-control-plane-manager
          service_account=$(kubectl -n "$ns" get deployment "$deployment" -o jsonpath='{.spec.template.spec.serviceAccountName}')
          subject="system:serviceaccount:${ns}:${service_account}"

          kubectl get crd agentpools.platform.iterabase.com workflows.platform.iterabase.com
          for resource in pods configmaps persistentvolumeclaims networkpolicies.networking.k8s.io agentpools.platform.iterabase.com workflows.platform.iterabase.com; do
            test "$(kubectl auth can-i list "$resource" --all-namespaces --as="$subject")" = yes
          done
          test "$(kubectl auth can-i get secrets -n "$ns" --as="$subject")" = yes

          kubectl -n "$ns" rollout status deployment/"$deployment" --timeout=2m
          # controller-runtime exits after its two-minute cache-sync timeout when
          # a watched CRD or RBAC grant is absent. Stay past that boundary.
          sleep 130
          test "$(kubectl -n "$ns" get deployment "$deployment" -o jsonpath='{.status.readyReplicas}')" = 1
          test "$(kubectl -n "$ns" get pods -l app.kubernetes.io/component=manager -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')" = 0
          if kubectl -n "$ns" logs deployment/"$deployment" --all-containers | grep -q 'Failed to run manager'; then
            echo "::error::control-plane manager exited after cache synchronization"
            exit 1
          fi
          echo "control-plane manager remained ready beyond cache synchronization"
      - name: validate AgentPool workload identity issuance
        run: |
          set -euo pipefail
          ns=iterabase-system
          kubectl -n "$ns" rollout status daemonset/cert-manager-csi-driver --timeout=2m
          kubectl get csidriver csi.cert-manager.io
          kubectl wait --for=condition=Ready clusterissuer/platform-spiffe-ca --timeout=2m
          cat <<'EOF' | kubectl apply -n "$ns" -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: workload-identity-csi-smoke
          spec:
            restartPolicy: Never
            containers:
              - name: verify
                image: busybox:1.37.0
                command: ["/bin/sh", "-c"]
                args: ["test -s /tls/tls.crt && test -s /tls/tls.key && test -s /tls/ca.crt"]
                volumeMounts:
                  - name: workload-identity
                    mountPath: /tls
                    readOnly: true
            volumes:
              - name: workload-identity
                csi:
                  driver: csi.cert-manager.io
                  readOnly: true
                  volumeAttributes:
                    csi.cert-manager.io/issuer-name: platform-spiffe-ca
                    csi.cert-manager.io/issuer-kind: ClusterIssuer
                    csi.cert-manager.io/uri-sans: spiffe://iterabase.local/pools/ci/workers/csi-smoke
                    csi.cert-manager.io/duration: 1h
          EOF
          for i in $(seq 1 60); do
            phase=$(kubectl get pod workload-identity-csi-smoke -n "$ns" -o jsonpath='{.status.phase}')
            case "$phase" in
              Succeeded)
                kubectl delete pod workload-identity-csi-smoke -n "$ns" --wait=false
                echo "cert-manager CSI issued and mounted a workload leaf"
                exit 0
                ;;
              Failed)
                break
                ;;
            esac
            sleep 2
          done
          echo "::error::cert-manager CSI workload leaf was not mounted"
          kubectl describe pod workload-identity-csi-smoke -n "$ns" || true
          kubectl get certificaterequest -A -o wide || true
          kubectl logs -n "$ns" daemonset/cert-manager-csi-driver --all-containers --tail=200 || true
          exit 1
      - name: wait for MetalLB to assign the ingress-nginx LB IP
        run: |
          # metallb-config renders IPAddressPool + L2Advertisement as post-install
          # hooks (after the MetalLB operator is Ready); wait for the pool, then
          # for MetalLB to assign an external IP to the ingress-nginx controller
          # Service.
          for i in $(seq 1 60); do
            [ -n "$(kubectl get ipaddresspool -n iterabase-system -o name 2>/dev/null)" ] && break
            sleep 1
          done
          echo "waiting for LoadBalancer external IP on the ingress-nginx Service..."
          for i in $(seq 1 90); do
            LB_IP=$(kubectl get svc -n iterabase-system -l app.kubernetes.io/name=ingress-nginx \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$LB_IP" ]; then
              echo "ingress-nginx LB IP: $LB_IP"
              echo "$LB_IP" > /tmp/lb-ip
              exit 0
            fi
            sleep 2
          done
          echo "::error::ingress-nginx LoadBalancer IP was not assigned in time"
          kubectl get svc -n iterabase-system || true
          kubectl get ipaddresspool,l2advertisement -A || true
          exit 1
      - name: wait for cert-manager to issue the gateway TLS cert
        run: |
          # The platform manages the selfsigned ClusterIssuer normally after
          # the ordered substrate is Ready; ingress-shim then issues the edge
          # certificate into the gateway TLS Secret.
          for i in $(seq 1 60); do
            kubectl get clusterissuer selfsigned >/dev/null 2>&1 && break
            sleep 1
          done
          kubectl wait --for=condition=Ready clusterissuer selfsigned --timeout=120s
          echo "waiting for gateway TLS Secret (iterabase-gateway-tls)..."
          for i in $(seq 1 90); do
            if [ -n "$(kubectl get secret iterabase-gateway-tls -n iterabase-system -o jsonpath='{.data.tls\.crt}' 2>/dev/null)" ]; then
              echo "gateway TLS cert issued"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway TLS cert was not issued in time"
          kubectl get certificate -n iterabase-system -o yaml || true
          exit 1
      - name: assert gateway HTTPS /health 200 (consolidated E2E edge check)
        run: |
          # Reach the gateway over the real public edge: runner -> LB IP ->
          # ingress-nginx (LoadBalancer, MetalLB-assigned) -> TLS (cert-manager
          # self-signed) -> gateway. -k: the self-signed cert is untrusted
          # (kind/E2E); --resolve pins the host to the MetalLB-assigned LB IP.
          # Retry to absorb ingress-nginx rule-sync lag + MetalLB/ARP convergence.
          LB_IP=$(cat /tmp/lb-ip)
          for i in $(seq 1 30); do
            if curl -fsS -k --resolve gateway.iterabase.local:443:"$LB_IP" \
              https://gateway.iterabase.local/health; then
              echo "gateway HTTPS /health 200 (via LB $LB_IP)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway HTTPS /health did not return 200 in time (LB $LB_IP)"
          kubectl get ingress -n iterabase-system -o wide || true
          kubectl describe ingress -n iterabase-system || true
          exit 1

  install-observability:
    # Installs the umbrella on kind WITH the observability preset
    # (values-observability.yaml) so the Prometheus/Grafana/Loki/Alertmanager
    # stack + Promtail + every component's exporter come up. kind's local-path
    # StorageClass backs the stack PVs. --wait fails the job if any directly-
    # managed pod CrashLoops (catches exporter flag/config regressions like the
    # postgres DSN / redis TLS / promtail Loki-URL fixes). The job also proves
    # available scrape targets, workload-log ingestion, and Prometheus/Loki
    # PV-backed persistence. Control-plane endpoint implementation and live
    # target evidence are split to HOR-414.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.24.0
      - name: helm repo add external chart repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
      - name: build deps (nested charts, certificate substrate, then umbrella)
        run: |
          helm dependency build charts/control-plane
          helm dependency build charts/observability
          helm dependency build charts/cert-manager-substrate
          helm dependency build charts/iterabase-platform
      - name: compute MetalLB pool from the kind docker-bridge subnet
        run: |
          subnets=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}}{{"\n"}}{{end}}')
          echo "kind subnets: $subnets"
          subnet=$(echo "$subnets" | grep -E '^[0-9]+\.' | head -1)
          if [ -z "$subnet" ]; then
            echo "::error::kind network has no IPv4 subnet ($(echo "$subnets" | tr '\n' ' '))"
            exit 1
          fi
          base=$(echo "$subnet" | cut -d. -f1-2)
          echo "using IPv4 subnet $subnet -> pool base $base"
          cat > /tmp/kind-edge.yaml <<EOF
          metallb:
            enabled: true
          metallb-config:
            enabled: true
            addresses:
              - ${base}.255.200-${base}.255.250
          EOF
          cat /tmp/kind-edge.yaml
      - name: install umbrella with the observability stack + edge (kind)
        run: |
          # Install the certificate substrate first, then the public edge plus
          # observability preset. Use the published control-plane tag; the new
          # runner is covered by its dedicated kind+Flux contract, not this
          # chart-only stack job.
          helm install iterabase-cert-manager charts/cert-manager-substrate \
            --create-namespace -n iterabase-system \
            --wait --timeout 5m
          helm install iterabase charts/iterabase-platform \
            -n iterabase-system \
            -f /tmp/kind-edge.yaml \
            -f values-observability.yaml \
            --set external-dns.enabled=false \
            --set control-plane.image.tag=0.0.18 \
            --set control-plane.toolRunner.enabled=false \
            --set control-plane.dispatch.defaultModel.id=test-model \
            --set control-plane.dispatch.defaultModel.api=test \
            --wait --timeout 15m
      - name: assert the four stack components + promtail + exporters are ready
        run: |
          set -e
          ns=iterabase-system
          # Wait for pods matching a label to exist, then to be Ready. The
          # Prometheus Operator creates the Prometheus StatefulSet asynchronously
          # (after the operator is Ready), so the pod may not exist right after
          # --wait; the existence loop absorbs that lag.
          wait_pods() {
            local label="$1"
            echo "waiting for pods: $label"
            for i in $(seq 1 60); do
              if [ -n "$(kubectl get pods -n "$ns" -l "$label" -o name 2>/dev/null)" ]; then
                kubectl wait --for=condition=Ready pod -n "$ns" -l "$label" --timeout=300s && return 0
              fi
              sleep 5
            done
            echo "::error::pods for $label never appeared"
            kubectl get pods -n "$ns" -l "$label" -o wide || true
            return 1
          }
          wait_pods "app.kubernetes.io/name=prometheus"
          wait_pods "app.kubernetes.io/name=grafana"
          wait_pods "app.kubernetes.io/name=loki,app.kubernetes.io/component=single-binary"
          wait_pods "app.kubernetes.io/name=alertmanager"
          wait_pods "app.kubernetes.io/name=promtail"
          wait_pods "app.kubernetes.io/name=postgresql,app.kubernetes.io/component=exporter"
          wait_pods "app.kubernetes.io/name=redis,app.kubernetes.io/component=exporter"
          echo "all observability targets ready"
          kubectl get pods -n "$ns" -o wide | grep -E "prometheus|grafana|loki|alertmanager|promtail|exporter" || true
      - name: assert data and exporter EndpointSlices are disjoint
        run: python3 scripts/assert-service-endpoints.py
      - name: helm test (runs the chart's helm tests)
        run: helm test iterabase -n iterabase-system --timeout 5m
      - name: assert Prometheus PV-backed data persists across pod restart
        run: |
          set -e
          ns=iterabase-system
          prom_svc=iterabase-kube-prometheus-prometheus
          # Query Prometheus for up{job="postgresql"} (the postgres exporter is
          # up) and return the series count; 0 = not scraped / not queryable yet.
          wait_query() {
            for i in $(seq 1 30); do
              n=$(curl -fsS -G "http://localhost:9090/api/v1/query" --data-urlencode 'query=up{job="postgresql"}' \
                | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d["data"]["result"]))' 2>/dev/null || echo 0)
              [ "$n" -gt 0 ] && { echo "$n"; return 0; }
              sleep 5
            done
            echo 0
          }
          kubectl port-forward -n "$ns" svc/$prom_svc 9090:9090 >/dev/null 2>&1 &
          pf=$!
          sleep 5
          echo "waiting for Prometheus to scrape the postgres exporter..."
          n=$(wait_query)
          echo "pre-restart up{job=postgresql} series: $n"
          [ "$n" -gt 0 ] || { echo "::error::Prometheus never scraped postgresql before restart"; kill $pf 2>/dev/null || true; exit 1; }
          kill $pf 2>/dev/null || true; sleep 1
          # Restart the Prometheus pod (operator-managed StatefulSet reattaches its
          # volumeClaimTemplate PVC); the TSDB on the PV must survive.
          prom_pod=$(kubectl get pods -n "$ns" -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[0].metadata.name}')
          echo "restarting Prometheus pod $prom_pod (PV must persist the TSDB)..."
          kubectl delete pod -n "$ns" "$prom_pod" --wait
          for i in $(seq 1 60); do
            [ -n "$(kubectl get pods -n "$ns" -l app.kubernetes.io/name=prometheus -o name 2>/dev/null)" ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready pod -n "$ns" -l app.kubernetes.io/name=prometheus --timeout=300s
          kubectl port-forward -n "$ns" svc/$prom_svc 9090:9090 >/dev/null 2>&1 &
          pf=$!
          sleep 5
          n2=$(wait_query)
          echo "post-restart up{job=postgresql} series: $n2"
          kill $pf 2>/dev/null || true
          [ "$n2" -gt 0 ] || { echo "::error::Prometheus TSDB data did not persist across pod restart (PV not retained)"; exit 1; }
          echo "Prometheus PV-backed data persisted across pod restart"

      - name: assert promtail → Loki log ingestion + Loki PV persistence
        run: |
          set -e
          ns=iterabase-system
          # Emit a unique marker log from a short-lived pod; promtail tails
          # container logs (kubernetes_sd role=pod) and pushes them to Loki, so
          # observing the marker in Loki proves workload log ingestion (HOR-408
          # outcome: "logs are collected, stored, and routed").
          marker="lokipvtest$(date +%s)"
          emitter="log-emitter-$marker"
          kubectl delete pod -n "$ns" "$emitter" --ignore-not-found >/dev/null 2>&1 || true
          kubectl run "$emitter" --namespace "$ns" --image=busybox:1.36 \
            --restart=Never --quiet \
            -- sh -c "i=0; while [ \$i -lt 45 ]; do echo $marker; sleep 1; i=\$((i+1)); done"
          kubectl port-forward -n "$ns" svc/iterabase-loki 3100:3100 >/dev/null 2>&1 &
          pf=$!
          sleep 5
          # Confirm Loki is queryable before polling.
          curl -fsS "http://localhost:3100/ready" >/dev/null 2>&1 || { echo "::error::Loki /ready failed"; kill $pf 2>/dev/null || true; exit 1; }
          query_marker() {
            # Returns the raw Loki query_range response. Uses the stream selector
            # {pod="$emitter"} (promtail's default relabel sets `pod`) plus a
            # line filter on the marker. start/end in ns cover the last 10 min.
            curl -sS -G "http://localhost:3100/loki/api/v1/query_range" \
              --data-urlencode "query={pod=\"$emitter\"} |= \"$marker\"" \
              --data-urlencode "start=$(($(date +%s)-600))000000000" \
              --data-urlencode "end=$(($(date +%s)+60))000000000" \
              --data-urlencode "direction=forward" \
              --data-urlencode "limit=20" 2>&1 || true
          }
          wait_marker() {
            for i in $(seq 1 40); do
              resp=$(query_marker)
              if echo "$resp" | grep -q "$marker"; then echo found; return 0; fi
              sleep 5
            done
            echo "::warning::Loki labels:"; curl -sS "http://localhost:3100/loki/api/v1/labels" 2>&1 | head -c 800; echo
            echo "::warning::Loki {namespace=iterabase-system} sample:"; curl -sS -G "http://localhost:3100/loki/api/v1/query_range" --data-urlencode 'query={namespace="iterabase-system"}' --data-urlencode "start=$(($(date +%s)-600))000000000" --data-urlencode "end=$(($(date +%s)+60))000000000" --data-urlencode "limit=3" 2>&1 | head -c 800; echo
            echo "::warning::marker query response:"; echo "$resp" | head -c 800; echo
            echo notfound
          }
          echo "waiting for promtail to ingest the marker log into Loki..."
          [ "$(wait_marker)" = found ] || { echo "::error::marker log not ingested into Loki (promtail → Loki broken)"; kubectl logs -n "$ns" -l app.kubernetes.io/name=promtail --tail=30 2>/dev/null || true; kill $pf 2>/dev/null || true; exit 1; }
          echo "promtail → Loki log ingestion OK"
          # Restart the Loki SingleBinary pod; the filesystem PVC must persist
          # the TSDB index + chunks so the marker is still queryable (HOR-408
          # acceptance: Loki persists data across pod restarts).
          kill $pf 2>/dev/null || true; sleep 1
          loki_pod=$(kubectl get pods -n "$ns" -l app.kubernetes.io/name=loki,app.kubernetes.io/component=single-binary -o jsonpath='{.items[0].metadata.name}')
          echo "restarting Loki pod $loki_pod (PV must persist the index/chunks)..."
          kubectl delete pod -n "$ns" "$loki_pod" --wait
          for i in $(seq 1 60); do
            [ -n "$(kubectl get pods -n "$ns" -l app.kubernetes.io/name=loki,app.kubernetes.io/component=single-binary -o name 2>/dev/null)" ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready pod -n "$ns" -l app.kubernetes.io/name=loki,app.kubernetes.io/component=single-binary --timeout=300s
          kubectl port-forward -n "$ns" svc/iterabase-loki 3100:3100 >/dev/null 2>&1 &
          pf=$!
          sleep 5
          [ "$(wait_marker)" = found ] || { echo "::error::Loki log data did not persist across pod restart (PV not retained)"; kill $pf 2>/dev/null || true; exit 1; }
          kill $pf 2>/dev/null || true
          kubectl delete pod -n "$ns" "$emitter" --ignore-not-found >/dev/null 2>&1 || true
          echo "Loki PV-backed log data persisted across pod restart"

  install-observability-tls:
    # Combined TLS + observability runtime check (HOR-408 / F6): installs the
    # umbrella on kind with internalTLS ON (values-tls.yaml) AND the observability
    # stack (values-observability.yaml), then asserts the four stack components
    # actually serve HTTPS, then proves both internal client paths under TLS:
    # Promtail pushes a workload marker to HTTPS-only Loki and Prometheus sends
    # a firing rule to HTTPS-only Alertmanager. This is the safety net that makes
    # stack-component and client TLS maintainable across chart bumps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.24.0
      - name: helm repo add external chart repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
      - name: build deps (nested charts, certificate substrate, then umbrella)
        run: |
          helm dependency build charts/control-plane
          helm dependency build charts/observability
          helm dependency build charts/cert-manager-substrate
          helm dependency build charts/iterabase-platform
      - name: compute MetalLB pool from the kind docker-bridge subnet
        run: |
          subnets=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}}{{"\n"}}{{end}}')
          subnet=$(echo "$subnets" | grep -E '^[0-9]+\.' | head -1)
          base=$(echo "$subnet" | cut -d. -f1-2)
          cat > /tmp/kind-edge.yaml <<EOF
          metallb:
            enabled: true
          metallb-config:
            enabled: true
            addresses:
              - ${base}.255.200-${base}.255.250
          EOF
      - name: install certificate substrate then internal-TLS platform
        run: |
          # cert-manager is a separate, ordered release. Its CRDs, controller,
          # and webhook are Ready before the platform submits issuers or leaf
          # Certificates, so no lifecycle hooks or plaintext bootstrap are
          # required. Use the published control-plane tag; this chart-only job
          # has no Flux source, so runner runtime coverage stays in the dedicated
          # kind+Flux contract.
          helm install iterabase-cert-manager charts/cert-manager-substrate \
            --create-namespace -n iterabase-system \
            --wait --timeout 5m
          helm install iterabase charts/iterabase-platform \
            -n iterabase-system \
            -f /tmp/kind-edge.yaml -f values-observability.yaml -f values-tls.yaml \
            --set external-dns.enabled=false \
            --set control-plane.image.tag=0.0.18 \
            --set control-plane.toolRunner.enabled=false \
            --set control-plane.dispatch.defaultModel.id=test-model \
            --set control-plane.dispatch.defaultModel.api=test \
            --wait --timeout 15m
      - name: debug pods on failure
        if: failure()
        run: |
          kubectl get pods -n iterabase-system -o wide || true
          echo "=== Certificates + issuers ==="
          kubectl get certificate -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[0].status,REASON:.status.conditions[0].reason,MSG:.status.conditions[0].message 2>/dev/null || true
          kubectl get clusterissuer -o custom-columns=NAME:.metadata.name,READY:.status.conditions[0].status 2>/dev/null || true
          echo "=== cert-manager logs (last 30) ==="
          kubectl logs -n iterabase-system -l app.kubernetes.io/name=cert-manager --tail=30 2>/dev/null || true
          echo "=== non-Running pods ==="
          kubectl get pods -n iterabase-system --no-headers | awk '{print $1}' | while read p; do
            st=$(kubectl get pod -n iterabase-system "$p" -o jsonpath='{.status.phase}' 2>/dev/null)
            [ "$st" = "Running" ] && continue
            echo "===== $p ($st) ====="
            kubectl describe pod -n iterabase-system "$p" 2>/dev/null | grep -iE "Events:|Warning|Failed|Mount|secret|not found|createcontainer" | tail -15
            kubectl logs -n iterabase-system "$p" --tail=20 2>/dev/null | tail -20
          done || true
      - name: assert the four stack components serve HTTPS (TLS handshake)
        run: |
          set -e
          ns=iterabase-system
          # Wait for cert-manager to issue the four normally managed stack leaf
          # Certificates from the internal CA.
          for s in observability-prometheus-tls observability-alertmanager-tls observability-grafana-tls observability-loki-tls; do
            echo "waiting for cert Secret $s ..."
            for i in $(seq 1 90); do
              [ -n "$(kubectl get secret -n "$ns" "$s" -o jsonpath='{.data.tls\.crt}' 2>/dev/null)" ] && break
              sleep 2
            done
            [ -n "$(kubectl get secret -n "$ns" "$s" -o jsonpath='{.data.tls\.crt}' 2>/dev/null)" ] || { echo "::error::cert $s not issued"; exit 1; }
          done
          # Wait for the stack pods to be Ready.
          wait_pods() {
            local label="$1"
            for i in $(seq 1 60); do
              [ -n "$(kubectl get pods -n "$ns" -l "$label" -o name 2>/dev/null)" ] && { kubectl wait --for=condition=Ready pod -n "$ns" -l "$label" --timeout=300s && return 0; }
              sleep 5
            done
            echo "::error::pods $label never appeared"; return 1
          }
          wait_pods "app.kubernetes.io/name=prometheus"
          wait_pods "app.kubernetes.io/name=alertmanager"
          wait_pods "app.kubernetes.io/name=grafana"
          wait_pods "app.kubernetes.io/name=loki,app.kubernetes.io/component=single-binary"
          # Assert HTTPS: port-forward each Service, curl -k (skip CA verify; the
          # internal CA is self-signed) — a successful response means the TLS
          # handshake completed (the component is serving HTTPS, not plaintext).
          assert_https() {
            local svc="$1" localport="$2" port="$3" path="$4"
            kubectl port-forward -n "$ns" "svc/$svc" "${localport}:${port}" >/dev/null 2>&1 &
            local pf=$!
            sleep 3
            if curl -fsS -k "https://localhost:${localport}${path}" >/dev/null 2>&1; then
              echo "  OK  https://$svc:$port$path"
              kill $pf 2>/dev/null || true; return 0
            fi
            echo "  FAIL https://$svc:$port$path (TLS handshake did not succeed)"
            kill $pf 2>/dev/null || true; return 1
          }
          assert_https iterabase-kube-prometheus-prometheus 9090 9090 /-/healthy
          assert_https iterabase-kube-prometheus-alertmanager 9093 9093 /-/healthy
          assert_https iterabase-grafana 3000 80 /api/health
          assert_https iterabase-loki 3100 3100 /ready
          echo "all four observability stack components serve HTTPS over internal TLS"

      - name: assert TLS data and exporter EndpointSlices are disjoint
        run: python3 scripts/assert-service-endpoints.py

      - name: assert PostgreSQL and Redis exporters reach their TLS+AUTH backends
        run: |
          set -euo pipefail
          ns=iterabase-system
          kubectl port-forward -n "$ns" svc/iterabase-kube-prometheus-prometheus 19090:9090 >/dev/null 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -fsS -k https://localhost:19090/-/ready >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -k https://localhost:19090/-/ready >/dev/null

          for metric in pg_up redis_up; do
            value=""
            for _ in $(seq 1 60); do
              response=$(curl -fsS -k -G https://localhost:19090/api/v1/query \
                --data-urlencode "query=$metric")
              value=$(python3 -c 'import json, sys; result=json.load(sys.stdin)["data"]["result"]; print(result[0]["value"][1] if result else "")' <<<"$response")
              [ "$value" = 1 ] && break
              sleep 5
            done
            if [ "$value" != 1 ]; then
              echo "::error::$metric did not become 1 (last value: ${value:-missing})"
              [ "$metric" = pg_up ] && exporter_name=postgresql || exporter_name=redis
              kubectl logs -n "$ns" -l app.kubernetes.io/name="$exporter_name",app.kubernetes.io/component=exporter --tail=50 2>/dev/null || true
              exit 1
            fi
            echo "$metric=1"
          done

      - name: assert TLS client paths (Promtail → Loki + Prometheus → Alertmanager)
        run: |
          set -euo pipefail
          ns=iterabase-system
          loki_pf=""
          alertmanager_pf=""
          emitter=""
          cleanup() {
            [ -z "$loki_pf" ] || kill "$loki_pf" 2>/dev/null || true
            [ -z "$alertmanager_pf" ] || kill "$alertmanager_pf" 2>/dev/null || true
            [ -z "$emitter" ] || kubectl delete pod -n "$ns" "$emitter" --ignore-not-found >/dev/null 2>&1 || true
            kubectl delete prometheusrule -n "$ns" iterabase-tls-path-probe --ignore-not-found >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Loki serves HTTPS-only in this job. Seeing a fresh pod log in Loki
          # therefore proves that Promtail's configured client successfully
          # pushed over TLS; merely curling Loki would test only the server.
          marker="tlslogpath$(date +%s)"
          emitter="tls-log-emitter-$marker"
          kubectl run "$emitter" --namespace "$ns" --image=busybox:1.36 \
            --restart=Never --quiet \
            -- sh -c "i=0; while [ \$i -lt 60 ]; do echo $marker; sleep 1; i=\$((i+1)); done"
          kubectl port-forward -n "$ns" svc/iterabase-loki 3100:3100 >/dev/null 2>&1 &
          loki_pf=$!
          for i in $(seq 1 30); do
            curl -fsS -k https://localhost:3100/ready >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -k https://localhost:3100/ready >/dev/null
          found_marker=false
          for i in $(seq 1 60); do
            response=$(curl -fsS -k -G https://localhost:3100/loki/api/v1/query_range \
              --data-urlencode "query={pod=\"$emitter\"} |= \"$marker\"" \
              --data-urlencode "start=$(($(date +%s)-600))000000000" \
              --data-urlencode "end=$(($(date +%s)+60))000000000" \
              --data-urlencode "direction=forward" \
              --data-urlencode "limit=20" 2>/dev/null || true)
            if echo "$response" | grep -q "$marker"; then
              found_marker=true
              break
            fi
            sleep 5
          done
          if [ "$found_marker" != true ]; then
            echo "::error::Promtail did not deliver the marker to HTTPS-only Loki"
            kubectl logs -n "$ns" -l app.kubernetes.io/name=promtail --tail=50 2>/dev/null || true
            exit 1
          fi
          echo "Promtail → Loki log ingestion succeeded over TLS"
          kill "$loki_pf" 2>/dev/null || true
          loki_pf=""

          # Create an always-firing rule selected by the cluster-wide nil rule
          # selector. Alertmanager also serves HTTPS-only in this job, so the
          # alert appearing in its API proves Prometheus used the configured
          # HTTPS/TLS alerting endpoint rather than merely loading the rule.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: iterabase-tls-path-probe
            namespace: iterabase-system
          spec:
            groups:
              - name: iterabase-tls-path-probe
                interval: 5s
                rules:
                  - alert: IterabaseTLSPathProbe
                    expr: vector(1)
                    labels:
                      severity: none
                    annotations:
                      summary: TLS CI path probe
          EOF
          kubectl port-forward -n "$ns" svc/iterabase-kube-prometheus-alertmanager 9093:9093 >/dev/null 2>&1 &
          alertmanager_pf=$!
          for i in $(seq 1 30); do
            curl -fsS -k https://localhost:9093/-/ready >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -k https://localhost:9093/-/ready >/dev/null
          delivered=false
          for i in $(seq 1 60); do
            if curl -fsS -k https://localhost:9093/api/v2/alerts 2>/dev/null \
              | python3 -c 'import json,sys; alerts=json.load(sys.stdin); raise SystemExit(0 if any(a.get("labels", {}).get("alertname") == "IterabaseTLSPathProbe" for a in alerts) else 1)'; then
              delivered=true
              break
            fi
            sleep 5
          done
          if [ "$delivered" != true ]; then
            echo "::error::Prometheus did not deliver the probe alert to HTTPS-only Alertmanager"
            kubectl get prometheusrule -n "$ns" iterabase-tls-path-probe -o yaml || true
            kubectl logs -n "$ns" -l app.kubernetes.io/name=prometheus --tail=50 2>/dev/null || true
            kubectl logs -n "$ns" -l app.kubernetes.io/name=alertmanager --tail=50 2>/dev/null || true
            exit 1
          fi
          echo "Prometheus → Alertmanager alert delivery succeeded over TLS"
