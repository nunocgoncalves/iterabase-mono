# Runtime-only fixture for HOR-506. The supported 0.3.12 predecessor already
# runs observability; corrected-current first adds these four private routes and
# their class-isolated controller. Edge certificates and LoadBalancer allocation
# are covered by the dedicated ingress scenario/static fixture, so this recovery
# journey uses ClusterIP controller Services and focuses on Helm rollout/admission
# ordering on one Kind node.

observability:
  kube-prometheus-stack:
    grafana:
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
          nginx.ingress.kubernetes.io/proxy-ssl-secret: iterabase-system/observability-grafana-tls
          nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-name: iterabase-grafana.iterabase-system.svc
        hosts:
          - grafana.recovery.iterabase.local
    prometheus:
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
          nginx.ingress.kubernetes.io/proxy-ssl-secret: iterabase-system/observability-prometheus-tls
          nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-name: iterabase-kube-prometheus-stack-prometheus.iterabase-system.svc
        hosts:
          - prometheus.recovery.iterabase.local
        paths:
          - /
    alertmanager:
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
          nginx.ingress.kubernetes.io/proxy-ssl-secret: iterabase-system/observability-alertmanager-tls
          nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
          nginx.ingress.kubernetes.io/proxy-ssl-name: iterabase-kube-prometheus-stack-alertmanager.iterabase-system.svc
        hosts:
          - alertmanager.recovery.iterabase.local
        paths:
          - /
  loki:
    gateway:
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - host: loki.recovery.iterabase.local
            paths:
              - path: /
                pathType: Prefix
